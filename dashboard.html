<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - CardHub</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 0;
      background: #f3f4ff;
      color: #17172b;
      font-family: Arial, sans-serif;
    }

    main.dashboard {
      width: 100%;
      max-width: 1500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 30px;
    }

    .dashboard-header,
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .dashboard-header {
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid #e4e4f1;
    }

    .dashboard-header h1 {
      margin: 8px 0;
      color: #191833;
      font-size: clamp(26px, 2.3vw, 34px);
      line-height: 1.2;
    }

    .welcome-text {
      margin: 0;
      color: #717187;
      font-size: 14px;
    }

    .guest-notice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      padding: 14px 16px;
      border: 1px solid #d9d1ff;
      border-radius: 13px;
      background: #f4f0ff;
      color: #342563;
    }

    .guest-notice p { margin: 4px 0 0; color: #625b78; }

    .guest-exit {
      flex: 0 0 auto;
      padding: 9px 13px;
      border: 0;
      border-radius: 9px;
      background: #6041c1;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card,
    .card-preview,
    .transaction,
    .empty-state {
      min-width: 0;
      border: 1px solid #e2e2f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 5px 18px #2017470a;
    }

    .summary-card { padding: 20px; }

    .summary-icon {
      display: grid;
      width: 42px;
      height: 42px;
      margin-bottom: 14px;
      place-items: center;
      border-radius: 13px;
      background: #eee9ff;
      color: #6041c1;
      font-size: 20px;
    }

    .summary-card p {
      margin: 0 0 8px;
      color: #77778d;
      font-size: 14px;
    }

    .summary-card h2 {
      margin: 0;
      color: #5838bd;
      font-size: 28px;
      overflow-wrap: anywhere;
    }

    .dashboard-section { margin-top: 24px; }

    .section-header { margin-bottom: 14px; }

    .section-header h2 {
      margin: 0;
      color: #5233b2;
      font-size: 24px;
    }

    .view-all {
      color: #5b38c4;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .view-all:hover { text-decoration: underline; }

    .cards-scroll {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr));
      gap: 16px;
    }

    .card-preview {
      display: flex;
      min-height: 180px;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      border: 0;
      background: linear-gradient(135deg, #29264f, #4c3b8e 55%, #7659d6);
      color: #fff;
      cursor: pointer;
      text-align: left;
    }

    .card-top,
    .card-bottom {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .card-top { font-size: 13px; font-weight: 700; }
    .card-name { margin: 12px 0 4px; font-weight: 700; }
    .card-number { margin: 0; letter-spacing: 2px; }
    .card-bottom { font-size: 11px; overflow-wrap: anywhere; }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .action-card {
      display: flex;
      width: 160px;
      min-height: 120px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      border: 1px solid #e2e0f0;
      border-radius: 15px;
      background: #fff;
      color: #292044;
      cursor: pointer;
      text-align: left;
    }

    .action-card span {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 12px;
      background: #eee9ff;
      color: #5b38c4;
      font-size: 22px;
    }

    .action-card p { margin: 0; font-weight: 700; }

    .transaction-list {
      display: grid;
      gap: 10px;
    }

    .transaction {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      cursor: pointer;
      text-align: left;
    }

    .transaction-icon {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border-radius: 12px;
      background: #eee9ff;
    }

    .transaction-info { min-width: 0; flex: 1; }
    .transaction-info h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; }
    .transaction-info p,
    .transaction-amount span { margin: 0; color: #77778d; font-size: 13px; }

    .transaction-amount { text-align: right; }
    .transaction-amount strong { display: block; }

    .empty-state {
      padding: 20px;
      color: #717187;
    }

    .empty-state h3 { margin: 0 0 6px; color: #292044; }
    .empty-state p { margin: 0; overflow-wrap: anywhere; }

    button, a { font: inherit; }

    @media (max-width: 760px) {
      main.dashboard { padding: 20px 14px 32px; }
      .summary-grid { grid-template-columns: 1fr; }
      .dashboard-header { align-items: flex-start; }
      .section-header h2 { font-size: 21px; }
      .action-card { width: calc(50% - 7px); }
    }

    @media (max-width: 480px) {
      .guest-notice { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>

<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <div>
        <p class="welcome-text" id="welcomeText">Welcome back</p>
        <h1 id="welcomeName">Welcome 👋</h1>
      </div>
    </header>

    <aside class="guest-notice" id="guestNotice" hidden>
      <div>
        <strong>You’re exploring CardHub as a guest</strong>
        <p>This demo uses sample data. Your real account and cards are not changed.</p>
      </div>
      <button class="guest-exit" id="exitGuestButton" type="button">Exit demo</button>
    </aside>

    <section class="summary-grid" aria-label="Account summary">
      <article class="summary-card">
        <span class="summary-icon" aria-hidden="true">💳</span>
        <p>Total Cards</p>
        <h2 id="totalCards">—</h2>
      </article>

      <article class="summary-card">
        <span class="summary-icon" aria-hidden="true">✓</span>
        <p>Active Cards</p>
        <h2 id="activeCards">—</h2>
      </article>

      <article class="summary-card">
        <span class="summary-icon" aria-hidden="true">₹</span>
        <p>Total Expense</p>
        <h2 id="totalExpense">—</h2>
      </article>
    </section>

    <section class="dashboard-section">
      <div class="section-header">
        <h2>My Cards</h2>
        <a class="view-all" href="cards.html">View all</a>
      </div>
      <div class="cards-scroll" id="dashboardCards" aria-live="polite">
        <p class="empty-state">Loading cards…</p>
      </div>
    </section>

    <section class="dashboard-section">
      <div class="section-header">
        <h2>Quick Actions</h2>
      </div>
      <div class="quick-actions">
        <button class="action-card" type="button" data-href="add-card.html">
          <span aria-hidden="true">＋</span>
          <p>Add Card</p>
        </button>
        <button class="action-card" type="button" data-href="explore.html">
          <span aria-hidden="true">🔎</span>
          <p>Explore</p>
        </button>
      </div>
    </section>

    <section class="dashboard-section">
      <div class="section-header">
        <h2>Recent Transactions</h2>
        <a class="view-all" href="transactions.html">View all</a>
      </div>
      <div class="transaction-list" id="dashboardTransactions" aria-live="polite">
        <p class="empty-state">Loading transactions…</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://wrsqhsuktqldnyjrbuma.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";

    const byId = id => document.getElementById(id);
    const params = new URLSearchParams(window.location.search);
    const guestRequested = params.get("guest") === "1";

    if (guestRequested) {
      sessionStorage.setItem("cardhub_guest_mode", "true");
    }

    const isGuest = sessionStorage.getItem("cardhub_guest_mode") === "true";

    const demoCards = [
      {
        id: "demo-card-1",
        name: "Everyday Rewards",
        number_last4: "5464",
        issuer: "CardHub Bank",
        status: "active"
      },
      {
        id: "demo-card-2",
        name: "Travel Plus",
        number_last4: "2198",
        issuer: "Northstar Bank",
        status: "active"
      },
      {
        id: "demo-card-3",
        name: "Backup Debit",
        number_last4: "8072",
        issuer: "City Bank",
        status: "inactive"
      }
    ];

    const demoTransactions = [
      {
        id: "demo-transaction-1",
        merchant: "Fresh Market",
        amount: 1840,
        category: "Groceries",
        transaction_date: "2026-11-23",
        type: "expense"
      },
      {
        id: "demo-transaction-2",
        merchant: "Metro Travel",
        amount: 620,
        category: "Transport",
        transaction_date: "2026-11-21",
        type: "expense"
      },
      {
        id: "demo-transaction-3",
        merchant: "Cafe Corner",
        amount: 390,
        category: "Food",
        transaction_date: "2026-11-19",
        type: "expense"
      },
      {
        id: "demo-transaction-4",
        merchant: "Monthly allowance",
        amount: 12000,
        category: "Income",
        transaction_date: "2026-11-15",
        type: "income"
      }
    ];

    const supabaseClient = isGuest
      ? null
      : window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    function makeText(tag, value, className) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = String(value ?? "");
      return element;
    }

    function showMessage(container, title, message) {
      const box = document.createElement("div");
      box.className = "empty-state";
      box.append(makeText("h3", title), makeText("p", message));
      container.replaceChildren(box);
    }

    function formatMoney(value) {
      const amount = Number(value) || 0;
      return "₹" + amount.toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value + "T00:00:00");
      return Number.isNaN(date.getTime())
        ? String(value)
        : date.toLocaleDateString("en-IN");
    }

    function renderCards(rows) {
      const container = byId("dashboardCards");

      byId("totalCards").textContent = String(rows.length);
      byId("activeCards").textContent = String(rows.filter(
        card => String(card.status || "").toLowerCase() === "active"
      ).length);

      if (!rows.length) {
        showMessage(container, "No cards added yet", "Add your first card to see it here.");
        return;
      }

      const fragment = document.createDocumentFragment();

      rows.forEach(card => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "card-preview";
        button.addEventListener("click", () => {
          const query = new URLSearchParams({ id: card.id });
          window.location.href = "card-details.html?" + query.toString();
        });

        const top = document.createElement("div");
        top.className = "card-top";
        top.append(makeText("span", "CardHub"), makeText("span", "💳"));

        const lastFour = card.number_last4 ||
          (card.number ? String(card.number).slice(-4) : "0000");

        const middle = document.createElement("div");
        middle.append(
          makeText("p", card.name || "Unnamed Card", "card-name"),
          makeText("p", "•••• •••• •••• " + lastFour, "card-number")
        );

        const bottom = document.createElement("div");
        bottom.className = "card-bottom";
        bottom.append(
          makeText("span", card.issuer || "Unknown Bank"),
          makeText("span", String(card.status || "ACTIVE").toUpperCase())
        );

        button.append(top, middle, bottom);
        fragment.append(button);
      });

      container.replaceChildren(fragment);
    }

    function renderTransactions(rows) {
      const container = byId("dashboardTransactions");
      const expenses = rows.filter(
        transaction => String(transaction.type || "expense").toLowerCase() === "expense"
      );

      byId("totalExpense").textContent = formatMoney(
        expenses.reduce((sum, row) => sum + (Number(row.amount) || 0), 0)
      );

      const recent = [...expenses]
        .sort((a, b) => String(b.transaction_date || "").localeCompare(
          String(a.transaction_date || "")
        ))
        .slice(0, 3);

      if (!recent.length) {
        showMessage(container, "No transactions yet", "Your recent expenses will appear here.");
        return;
      }

      const fragment = document.createDocumentFragment();

      recent.forEach(transaction => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "transaction";
        button.addEventListener("click", () => {
          window.location.href = "edit-transaction.html?id=" +
            encodeURIComponent(transaction.id);
        });

        const icon = makeText("span", "💳", "transaction-icon");
        const info = document.createElement("span");
        info.className = "transaction-info";
        info.append(
          makeText("h3", transaction.merchant || "Transaction"),
          makeText("p", formatDate(transaction.transaction_date))
        );

        const amount = document.createElement("span");
        amount.className = "transaction-amount";
        amount.append(
          makeText("strong", formatMoney(transaction.amount)),
          makeText("span", transaction.category || "Expense")
        );

        button.append(icon, info, amount);
        fragment.append(button);
      });

      container.replaceChildren(fragment);
    }

    async function loadGuestDashboard() {
      byId("welcomeText").textContent = "Guest demo";
      byId("welcomeName").textContent = "Explore CardHub 👋";
      byId("guestNotice").hidden = false;

      renderCards(demoCards);
      renderTransactions(demoTransactions);
    }

    async function loadUserDashboard() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error || !data.user) {
        window.location.href = "index.html";
        return;
      }

      const user = data.user;
      const name = user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email?.split("@")[0] ||
        "User";

      byId("welcomeName").textContent = name + " 👋";

      const [cardsResult, transactionsResult] = await Promise.all([
        supabaseClient
          .from("cards")
          .select("*")
          .order("created_at", { ascending: false }),

        supabaseClient
          .from("transactions")
          .select("id, merchant, amount, category, transaction_date, type")
          .eq("type", "expense")
          .order("transaction_date", { ascending: false })
      ]);

      if (cardsResult.error) {
        console.error("Cards error:", cardsResult.error);
        byId("totalCards").textContent = "—";
        byId("activeCards").textContent = "—";
        showMessage(byId("dashboardCards"), "Could not load cards", cardsResult.error.message);
      } else {
        renderCards(cardsResult.data || []);
      }

      if (transactionsResult.error) {
        console.error("Transactions error:", transactionsResult.error);
        showMessage(
          byId("dashboardTransactions"),
          "Could not load transactions",
          transactionsResult.error.message
        );
        byId("totalExpense").textContent = "—";
      } else {
        renderTransactions(transactionsResult.data || []);
      }
    }

    document.querySelectorAll("[data-href]").forEach(button => {
      button.addEventListener("click", () => {
        window.location.href = button.dataset.href;
      });
    });

    byId("exitGuestButton").addEventListener("click", () => {
      sessionStorage.removeItem("cardhub_guest_mode");
      window.location.href = "index.html";
    });

    (isGuest ? loadGuestDashboard() : loadUserDashboard()).catch(error => {
      console.error("Dashboard error:", error);
      showMessage(byId("dashboardCards"), "Dashboard error", "Please refresh and try again.");
    });
  </script>

  <script src="js/nav.js"></script>
</body>
</html>
