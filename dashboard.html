<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - CardHub</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 0;
      background: #f3f4ff;
      color: #17172b;
      font-family: Arial, sans-serif;
    }

    main.dashboard {
      width: 100%;
      max-width: 1500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 30px;
    }

    .dashboard-header,
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .dashboard-header {
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid #e4e4f1;
    }

    .dashboard-header h1 {
      margin: 8px 0;
      color: #191833;
      font-size: clamp(26px, 2.3vw, 34px);
      line-height: 1.2;
    }

    .welcome-text {
      margin: 0;
      color: #717187;
      font-size: 14px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card,
    .card-preview,
    .transaction,
    .empty-state {
      min-width: 0;
      border: 1px solid #e2e2f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 5px 18px #2017470a;
    }

    .summary-card {
      padding: 20px;
    }

    .summary-icon {
      display: grid;
      width: 42px;
      height: 42px;
      margin-bottom: 14px;
      place-items: center;
      border-radius: 13px;
      background: #eee9ff;
      color: #6041c1;
      font-size: 20px;
    }

    .summary-card p {
      margin: 0 0 8px;
      color: #77778d;
      font-size: 14px;
    }

    .summary-card h2 {
      margin: 0;
      color: #5838bd;
      font-size: 28px;
      overflow-wrap: anywhere;
    }

    .dashboard-section { margin-top: 24px; }

    .section-header { margin-bottom: 14px; }

    .section-header h2 {
      margin: 0;
      color: #5233b2;
      font-size: 24px;
    }

    .view-all {
      color: #5b38c4;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .view-all:hover { text-decoration: underline; }

    .cards-scroll {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr));
      gap: 16px;
    }

    .card-preview {
      display: flex;
      min-height: 180px;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      border: 0;
      background: linear-gradient(135deg, #29264f, #4c3b8e 55%, #7659d6);
      color: #fff;
      cursor: pointer;
      text-align: left;
    }

    .card-preview:hover,
    .action-card:hover {
      transform: translateY(-2px);
    }

    .card-top,
    .card-bottom {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .card-top { font-size: 13px; font-weight: 700; }
    .card-name { margin: 12px 0 4px; font-weight: 700; }
    .card-number { margin: 0; letter-spacing: 2px; }
    .card-bottom { font-size: 11px; overflow-wrap: anywhere; }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .action-card {
      display: flex;
      width: 160px;
      min-height: 120px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      border: 1px solid #e2e0f0;
      border-radius: 15px;
      background: #fff;
      color: #292044;
      cursor: pointer;
      text-align: left;
      transition: transform .15s;
    }

    .action-card span {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 12px;
      background: #eee9ff;
      color: #5b38c4;
      font-size: 22px;
    }

    .action-card p { margin: 0; font-weight: 700; }

    .transaction-list {
      display: grid;
      gap: 10px;
    }

    .transaction {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      cursor: pointer;
      text-align: left;
    }

    .transaction:hover { border-color: #bdb0ed; }

    .transaction-icon {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border-radius: 12px;
      background: #eee9ff;
    }

    .transaction-info { min-width: 0; flex: 1; }
    .transaction-info h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; }
    .transaction-info p,
    .transaction-amount span { margin: 0; color: #77778d; font-size: 13px; }

    .transaction-amount { text-align: right; }
    .transaction-amount strong { display: block; }

    .empty-state {
      padding: 20px;
      color: #717187;
    }

    .empty-state h3 { margin: 0 0 6px; color: #292044; }
    .empty-state p { margin: 0; overflow-wrap: anywhere; }

    button, a { font: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid #9b84e8;
      outline-offset: 3px;
    }

    @media (max-width: 760px) {
      main.dashboard { padding: 20px 14px 32px; }
      .summary-grid { grid-template-columns: 1fr; }
      .dashboard-header { align-items: flex-start; }
      .section-header h2 { font-size: 21px; }
      .action-card { width: calc(50% - 7px); }
    }
  </style>
</head>

<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <div>
        <p class="welcome-text">Welcome back</p>
        <h1 id="welcomeName">Welcome 👋</h1>
      </div>
    </header>

    <section class="summary-grid" aria-label="Account summary">
      <article class="summary-card">
        <span class="summary-icon" aria-hidden="true">💳</span>
        <p>Total Cards</p>
        <h2 id="totalCards">—</h2>
      </article>

      <article class="summary-card">
        <span class="summary-icon" aria-hidden="true">✓</span>
        <p>Active Cards</p>
        <h2 id="activeCards">—</h2>
      </article>

      <article class="summary-card">
        <span class="summary-icon" aria-hidden="true">₹</span>
        <p>Total Expense</p>
        <h2 id="totalExpense">—</h2>
      </article>
    </section>

    <section class="dashboard-section">
      <div class="section-header">
        <h2>My Cards</h2>
        <a class="view-all" href="cards.html">View all</a>
      </div>
      <div class="cards-scroll" id="dashboardCards" aria-live="polite">
        <p class="empty-state">Loading cards…</p>
      </div>
    </section>

    <section class="dashboard-section">
      <div class="section-header">
        <h2>Quick Actions</h2>
      </div>
      <div class="quick-actions">
        <button class="action-card" type="button" data-href="add-card.html">
          <span aria-hidden="true">＋</span>
          <p>Add Card</p>
        </button>
        <button class="action-card" type="button" data-href="explore.html">
          <span aria-hidden="true">🔎</span>
          <p>Explore</p>
        </button>
      </div>
    </section>

    <section class="dashboard-section">
      <div class="section-header">
        <h2>Recent Transactions</h2>
        <a class="view-all" href="transactions.html">View all</a>
      </div>
      <div class="transaction-list" id="dashboardTransactions" aria-live="polite">
        <p class="empty-state">Loading transactions…</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://wrsqhsuktqldnyjrbuma.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const byId = (id) => document.getElementById(id);

    function showMessage(container, title, message) {
      const box = document.createElement("div");
      box.className = "empty-state";

      const heading = document.createElement("h3");
      heading.textContent = title;

      const text = document.createElement("p");
      text.textContent = message;

      box.append(heading, text);
      container.replaceChildren(box);
    }

    function formatMoney(value) {
      const amount = Number(value);
      return "₹" + (Number.isFinite(amount) ? amount : 0).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    async function loadDashboard() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error || !data.user) {
        window.location.href = "index.html";
        return;
      }

      const user = data.user;
      const name = user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email?.split("@")[0] ||
        "User";

      byId("welcomeName").textContent = name + " 👋";

      await Promise.all([
        loadCards(),
        loadTransactions()
      ]);
    }

    async function loadCards() {
      const container = byId("dashboardCards");
      const { data: cards, error } = await supabaseClient
        .from("cards")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Cards error:", error);
        byId("totalCards").textContent = "—";
        byId("activeCards").textContent = "—";
        showMessage(container, "Could not load cards", error.message);
        return;
      }

      const rows = cards || [];
      byId("totalCards").textContent = String(rows.length);
      byId("activeCards").textContent = String(
        rows.filter(card => String(card.status || "").toLowerCase() === "active").length
      );

      if (!rows.length) {
        showMessage(container, "No cards added yet", "Add your first card to see it here.");
        return;
      }

      const fragment = document.createDocumentFragment();

      rows.forEach(card => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "card-preview";
        button.setAttribute("aria-label", "Open card details");

        button.addEventListener("click", () => {
          window.location.href = "card-details.html?id=" + encodeURIComponent(card.id);
        });

        const top = document.createElement("div");
        top.className = "card-top";
        top.append(makeText("span", "CardHub"), makeText("span", "💳"));

        const middle = document.createElement("div");
        middle.append(
          makeText("p", card.name || "Unnamed Card", "card-name"),
          makeText("p", "•••• •••• •••• " + getLastFour(card), "card-number")
        );

        const bottom = document.createElement("div");
        bottom.className = "card-bottom";
        bottom.append(
          makeText("span", card.issuer || "Unknown Bank"),
          makeText("span", String(card.status || "ACTIVE").toUpperCase())
        );

        button.append(top, middle, bottom);
        fragment.append(button);
      });

      container.replaceChildren(fragment);
    }

    function getLastFour(card) {
      if (card.number_last4) return String(card.number_last4).slice(-4);
      if (card.number) return String(card.number).slice(-4);
      return "0000";
    }

    function makeText(tag, value, className) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = String(value);
      return element;
    }

    async function loadTransactions() {
      const container = byId("dashboardTransactions");

      try {
        const [recentResult, expenseResult] = await Promise.all([
          supabaseClient
            .from("transactions")
            .select("id, card_id, merchant, amount, type, category, transaction_date")
            .eq("type", "expense")
            .order("transaction_date", { ascending: false })
            .order("id", { ascending: false })
            .limit(3),
          supabaseClient
            .from("transactions")
            .select("amount")
            .eq("type", "expense")
        ]);

        if (recentResult.error) throw recentResult.error;

        const expenses = expenseResult.data || [];
        if (!expenseResult.error) {
          const total = expenses.reduce((sum, row) => sum + (Number(row.amount) || 0), 0);
          byId("totalExpense").textContent = formatMoney(total);
        } else {
          console.error("Expense total error:", expenseResult.error);
          byId("totalExpense").textContent = "—";
        }

        const rows = recentResult.data || [];
        if (!rows.length) {
          showMessage(container, "No transactions yet", "Your recent expenses will appear here.");
          return;
        }

        const fragment = document.createDocumentFragment();

        rows.forEach(transaction => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "transaction";
          item.addEventListener("click", () => {
            window.location.href = "edit-transaction.html?id=" +
              encodeURIComponent(transaction.id);
          });

          const icon = makeText("span", "💳", "transaction-icon");
          icon.setAttribute("aria-hidden", "true");

          const info = document.createElement("span");
          info.className = "transaction-info";
          info.append(
            makeText("h3", transaction.merchant || "Transaction"),
            makeText("p", formatDate(transaction.transaction_date))
          );

          const amount = document.createElement("span");
          amount.className = "transaction-amount";
          amount.append(
            makeText("strong", formatMoney(transaction.amount)),
            makeText("span", transaction.category || "Expense")
          );

          item.append(icon, info, amount);
          fragment.append(item);
        });

        container.replaceChildren(fragment);
      } catch (error) {
        console.error("Transactions error:", error);
        byId("totalExpense").textContent = "—";
        showMessage(container, "Could not load transactions", error.message || "Please try again.");
      }
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value + "T00:00:00");
      return Number.isNaN(date.getTime()) ? "" :
        date.toLocaleDateString("en-IN");
    }

    document.querySelectorAll("[data-href]").forEach(button => {
      button.addEventListener("click", () => {
        window.location.href = button.dataset.href;
      });
    });

    loadDashboard().catch(error => {
      console.error("Dashboard error:", error);
      showMessage(byId("dashboardCards"), "Dashboard error", "Please refresh and try again.");
    });
  </script>

  <script src="js/nav.js"></script>
</body>
</html>
