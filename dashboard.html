<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - CardHub</title>

    <link rel="stylesheet" href="css/style.css">

<style id="cardhub-shared-sidebar">
:root{--ch-side-width:250px;--ch-side-bg:#191443;--ch-side-active:#5b35d5;--ch-side-text:#e8e5ff}
body{background:#f4f5ff}
.cardhub-sidebar{position:fixed;inset:0 auto 0 0;width:var(--ch-side-width);height:100vh;background:var(--ch-side-bg);color:var(--ch-side-text);z-index:1000;padding:28px 18px 16px;display:flex;flex-direction:column;font-family:Inter,Arial,sans-serif;overflow-y:auto}
.cardhub-brand{display:flex;align-items:center;gap:12px;padding:0 12px 40px;font-size:23px;font-weight:800;color:white;letter-spacing:-.5px}
.cardhub-brand-icon{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#9670ff,#5d31d7);display:grid;place-items:center;font-size:22px}
.cardhub-nav-label{font-size:10px;font-weight:800;letter-spacing:2px;color:#aaa1e3;padding:0 12px 15px}
.cardhub-nav{display:flex;flex-direction:column;gap:5px}
.cardhub-nav a{height:46px;display:flex;align-items:center;gap:14px;padding:0 14px;border-radius:12px;text-decoration:none;color:#d9d5f3;font-size:14px;font-weight:500;transition:background .15s}
.cardhub-nav a:hover{background:#ffffff12}.cardhub-nav a.active{background:var(--ch-side-active);color:white;box-shadow:0 7px 20px #3e20a544}
.cardhub-nav .ch-icon{width:18px;text-align:center;font-size:19px;color:#c9c0ff}
.cardhub-account{margin-top:auto;padding-top:28px}.cardhub-account .cardhub-nav-label{padding-bottom:15px}
.cardhub-quick{display:flex;flex-direction:column;gap:4px}.cardhub-quick a{height:44px;display:flex;align-items:center;gap:13px;padding:0 14px;text-decoration:none;color:#d9d5f3;font-size:14px;border-radius:10px}.cardhub-quick a:hover{background:#ffffff12}
.cardhub-user{margin-top:20px;border-top:1px solid #ffffff18;padding:16px 10px 0;display:flex;align-items:center;gap:11px}.cardhub-avatar{width:39px;height:39px;border-radius:50%;background:#e8ddff;color:#4c2bb4;display:grid;place-items:center;font-weight:800;flex-shrink:0}.cardhub-user strong{display:block;font-size:13px;color:white}.cardhub-user small{display:block;font-size:11px;color:#aaa1d8;margin-top:4px}
body{padding-left:var(--ch-side-width)!important}
body .bottom-navigation{display:none!important}
@media(max-width:760px){.cardhub-sidebar{width:220px;transform:translateX(-100%);transition:transform .2s}.cardhub-sidebar.open{transform:translateX(0)}body{padding-left:0!important}.ch-mobile-menu{display:block!important}.ch-sidebar-overlay.show{display:block}}
.ch-mobile-menu{display:none;border:1px solid #e1def1;background:white;border-radius:9px;padding:8px 11px;margin-right:10px}
.ch-sidebar-overlay{display:none;position:fixed;inset:0;background:#100b3577;z-index:999}
</style>
</head>

<body>
<aside class="cardhub-sidebar" id="cardhubSidebar"><div class="cardhub-brand"><span class="cardhub-brand-icon">▱</span><span>CardHub</span></div><div class="cardhub-nav-label">WORKSPACE</div><nav class="cardhub-nav"><a href="dashboard.html" class="active"><span class="ch-icon">▦</span><span>Dashboard</span></a><a href="cards.html" class=""><span class="ch-icon">▱</span><span>Cards</span></a><a href="transactions.html" class=""><span class="ch-icon">⇄</span><span>Transactions</span></a><a href="explore.html" class=""><span class="ch-icon">◎</span><span>Explore</span></a></nav><section class="cardhub-account"><div class="cardhub-nav-label">ACCOUNT</div><div class="cardhub-quick"><a href="profile.html"><span class="ch-icon">⚙</span><span>Settings &amp; Profile</span></a><a href="add-card.html"><span class="ch-icon">⊕</span><span>Add Card</span></a><a href="add-transaction.html"><span class="ch-icon">⊕</span><span>Add Transaction</span></a></div><div class="cardhub-user"><div class="cardhub-avatar" id="chSidebarAvatar">CH</div><div><strong id="chSidebarName">My CardHub</strong><small>Personal account</small></div></div></section></aside><div class="ch-sidebar-overlay" id="chSidebarOverlay"></div>

    <main class="dashboard">

        <!-- Header -->
        <header class="dashboard-header">

            <div>
                <p class="welcome-text">Welcome back</p>
                <h1 id="welcomeName">Welcome 👋</h1>
            </div>

            <button class="notification-button">
                🔔
            </button>

        </header>


        <!-- Summary -->
        <section class="summary-grid">

            <div class="summary-card">

                <span class="summary-icon">💳</span>

                <div>
                    <p>Total Cards</p>
                    <h2 id="totalCards">0</h2>
                </div>

            </div>


            <div class="summary-card">

                <span class="summary-icon">✓</span>

                <div>
                    <p>Active Cards</p>
                    <h2 id="activeCards">0</h2>
                </div>

            </div>




            </div>


            <div class="summary-card">

                <span class="summary-icon">₹</span>

                <div>
                    <p>Total Expense</p>
                    <h2 id="totalExpense">₹0.00</h2>
                </div>

            </div>

        </section>


        <!-- My Cards -->
        <section class="dashboard-section">

            <div class="section-header">

                <h2>My Cards</h2>

                <a
                    href="cards.html"
                    class="view-all"
                >
                    View all
                </a>

            </div>


            <div
                class="cards-scroll"
                id="dashboardCards"
            >

                <!-- Cards loaded by JavaScript -->

            </div>

        </section>


       <!-- Quick Actions -->


            <div class="section-header">

                <h2>Quick Actions</h2>

            </div>


            <div class="quick-actions">

                <button
                    class="action-card"
                    onclick="window.location.href='add-card.html'"
                >

                    <span>＋</span>

                    <p>Add Card</p>

                </button>


                <button
                    class="action-card"
                    onclick="window.location.href='explore.html'"
                >

                    <span>🔎</span>

                    <p>Explore</p>

                </button>


               


               


        <!-- Recent Transactions -->
        <section class="dashboard-section">

            <div class="section-header">

                <h2>Recent Transactions</h2>

                <a
                    href="transactions.html"
                    class="view-all"
                >
                    View all
                </a>

            </div>


            <div
                class="transaction-list"
                id="dashboardTransactions"
            >

                <!-- Transactions loaded by JavaScript -->

            </div>

        </section>


        <!-- Bottom Navigation -->
        


    </main>


    <!-- Dashboard JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://wrsqhsuktqldnyjrbuma.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* ==============================
           LOAD DASHBOARD
           ============================== */

       async function loadDashboard() {

    const {
        data: {
            user
        },
        error: authError
    } = await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "index.html";
        return;
    }

    const welcomeName = document.getElementById("welcomeName");

    if (welcomeName) {
        const name =
            user.user_metadata?.full_name ||
            user.user_metadata?.name ||
            user.email?.split("@")[0] ||
            "User";

        welcomeName.textContent = name + " 👋";
    }

    await loadCards();

    await loadTransactions();
}


        /* ==============================
           LOAD CARDS FROM SUPABASE
           ============================== */

        async function loadCards() {

            const {
                data: cards,
                error
            } =
                await supabaseClient
                    .from("cards")
                    .select("*")
                    .order("created_at", {
                        ascending: false
                    });


            if (error) {

                console.error(
                    "Cards error:",
                    error
                );


                document.getElementById(
                    "totalCards"
                ).textContent = "0";


                document.getElementById(
                    "activeCards"
                ).textContent = "0";


                return;

            }


            const safeCards =
                cards || [];


            /* TOTAL CARDS */

            document.getElementById(
                "totalCards"
            ).textContent =
                safeCards.length;


            /* ACTIVE CARDS */

            const activeCards =
                safeCards.filter(
                    function(card) {

                        return String(
                            card.status || ""
                        ).toLowerCase() === "active";

                    }
                );


            document.getElementById(
                "activeCards"
            ).textContent =
                activeCards.length;


            /* DISPLAY CARDS */

            const dashboardCards =
                document.getElementById(
                    "dashboardCards"
                );


            if (safeCards.length === 0) {

                dashboardCards.innerHTML = `

                    <div class="empty-transactions">

                        <h3>No cards added yet</h3>

                        <p>
                            Add your first card.
                        </p>

                    </div>

                `;

                return;

            }


            dashboardCards.innerHTML = "";


            safeCards.forEach(
                function(card) {

                    const cardElement =
                        document.createElement("div");


                    cardElement.className =
                        "card-preview";


                    cardElement.style.cursor =
                        "pointer";


                    cardElement.onclick =
                        function() {

                            window.location.href =
                                "card-details.html?id=" +
                                encodeURIComponent(
                                    card.id
                                );

                        };


                    const last4 =
                        card.number_last4 ||
                        (
                            card.number
                                ? String(
                                    card.number
                                ).slice(-4)
                                : "0000"
                        );


                    cardElement.innerHTML = `

                        <div class="card-top">

                            <span>
                                CardHub
                            </span>

                            <span>
                                💳
                            </span>

                        </div>


                        <p class="card-name">

                            ${escapeHtml(
                                card.name ||
                                "Unnamed Card"
                            )}

                        </p>


                        <p class="card-number">

                            •••• •••• •••• ${last4}

                        </p>


                        <div class="card-bottom">

                            <span>

                                ${escapeHtml(
                                    card.issuer ||
                                    "Unknown Bank"
                                )}

                            </span>


                            <span>

                                ${escapeHtml(
                                    String(
                                        card.status ||
                                        "ACTIVE"
                                    ).toUpperCase()
                                )}

                            </span>

                        </div>

                    `;


                    dashboardCards.appendChild(
                        cardElement
                    );

                }
            );

        }


        /* ==============================
           LOAD TRANSACTIONS FROM SUPABASE
           ============================== */

        async function loadTransactions() {

            const dashboardTransactions =
                document.getElementById("dashboardTransactions");

            try {

                const {
                    data: transactions,
                    error
                } = await supabaseClient
                    .from("transactions")
                    .select("id, card_id, merchant, amount, type, category, transaction_date")
                    .eq("type", "expense")
                    .order("transaction_date", {
                        ascending: false
                    })
                    .order("id", {
                        ascending: false
                    })
                    .limit(3);

                console.log("CardHub transactions:", transactions);
                console.log("CardHub transaction error:", error);

                if (error) {
                    console.error("Transactions error:", error);

                    dashboardTransactions.innerHTML = `
                        <div class="empty-transactions">
                            <h3>Transaction loading error</h3>
                            <p>${escapeHtml(error.message || "Unable to load transactions.")}</p>
                        </div>
                    `;

                    return;
                }

                const safeTransactions = transactions || [];

                /* TOTAL EXPENSE */

                const {
                    data: expenseRows,
                    error: expenseError
                } = await supabaseClient
                    .from("transactions")
                    .select("amount")
                    .eq("type", "expense");

                if (!expenseError) {

                    const totalExpense = (expenseRows || []).reduce(
                        function(total, transaction) {
                            return total + Number(transaction.amount || 0);
                        },
                        0
                    );

                    const totalExpenseElement =
                        document.getElementById("totalExpense");

                    if (totalExpenseElement) {
                        totalExpenseElement.textContent =
                            "₹" +
                            totalExpense.toLocaleString("en-IN", {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2
                            });
                    }
                }

                /* RECENT TRANSACTIONS */

                if (safeTransactions.length === 0) {

                    dashboardTransactions.innerHTML = `
                        <div class="empty-transactions">
                            <h3>No transactions found</h3>
                            <p>Supabase returned 0 expense transactions for this account.</p>
                        </div>
                    `;

                    return;
                }

                dashboardTransactions.innerHTML = "";

                safeTransactions.forEach(
                    function(transaction) {

                        const transactionElement =
                            document.createElement("div");

                        transactionElement.className = "transaction";
                        transactionElement.style.cursor = "pointer";

                        transactionElement.onclick =
                            function() {
                                window.location.href =
                                    "edit-transaction.html?id=" +
                                    encodeURIComponent(transaction.id);
                            };

                        const amount =
                            Number(transaction.amount || 0);

                        const date =
                            transaction.transaction_date
                                ? new Date(
                                    transaction.transaction_date + "T00:00:00"
                                ).toLocaleDateString("en-IN")
                                : "";

                        transactionElement.innerHTML = `

                            <div class="transaction-icon">
                                💳
                            </div>

                            <div class="transaction-info">

                                <h3>
                                    ${escapeHtml(
                                        transaction.merchant || "Transaction"
                                    )}
                                </h3>

                                <p>
                                    ${escapeHtml(date)}
                                </p>

                            </div>

                            <div class="transaction-amount">

                                <strong>
                                    ₹${amount.toLocaleString("en-IN", {
                                        minimumFractionDigits: 2,
                                        maximumFractionDigits: 2
                                    })}
                                </strong>

                                <span>
                                    ${escapeHtml(transaction.category || "Expense")}
                                </span>

                            </div>

                        `;

                        dashboardTransactions.appendChild(
                            transactionElement
                        );

                    }
                );

            } catch (err) {

                console.error("CardHub transaction exception:", err);

                dashboardTransactions.innerHTML = `
                    <div class="empty-transactions">
                        <h3>Something went wrong</h3>
                        <p>${escapeHtml(err.message || "Unknown error")}</p>
                    </div>
                `;
            }
        }


        /* ==============================
           SAFE TEXT
           ============================== */

        function escapeHtml(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ==============================
           START
           ============================== */

        loadDashboard();

    </script>


<script id="cardhub-sidebar-controls">
(function(){
 const side=document.getElementById('cardhubSidebar'), overlay=document.getElementById('chSidebarOverlay');
 if(!side||!overlay)return;
 const btn=document.createElement('button');btn.className='ch-mobile-menu';btn.type='button';btn.textContent='☰';btn.setAttribute('aria-label','Open navigation');
 const heading=document.querySelector('h1');
 if(heading&&heading.parentElement){heading.parentElement.insertBefore(btn,heading);}
 btn.addEventListener('click',()=>{side.classList.add('open');overlay.classList.add('show')});
 overlay.addEventListener('click',()=>{side.classList.remove('open');overlay.classList.remove('show')});
 const name=document.getElementById('welcomeName');
 const userName=document.getElementById('chSidebarName');
 if(name&&userName)userName.textContent=name.textContent.replace(/\\s*👋\\s*$/,'')||'My CardHub';
})();
</script>
</body>

</html>
