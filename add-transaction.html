<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Transaction - CardHub</title>

    <link rel="stylesheet" href="css/style.css">


<style id="cardhub-transaction-page-layout">
:root {
  --ch-sidebar-width: 244px;
  --ch-bg: #f5f6ff;
  --ch-panel: #ffffff;
  --ch-ink: #1c2350;
  --ch-muted: #697095;
  --ch-purple: #4c2bc2;
  --ch-purple-dark: #24145f;
  --ch-border: #e3e5f5;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0 !important;
  min-height: 100vh;
  background: radial-gradient(circle at top right, #e8eaff 0, transparent 38%), var(--ch-bg) !important;
  color: var(--ch-ink);
}
main.dashboard {
  width: calc(100% - var(--ch-sidebar-width)) !important;
  max-width: none !important;
  min-height: 100vh;
  margin: 0 0 0 var(--ch-sidebar-width) !important;
  padding: clamp(24px, 4vw, 54px) clamp(20px, 4vw, 64px) 56px !important;
}
.dashboard-header {
  display: flex !important;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin: 0 auto 34px !important;
  width: 100%;
  max-width: 1440px;
}
.welcome-text {
  margin: 0 0 8px !important;
  color: var(--ch-purple) !important;
  font-weight: 700;
  letter-spacing: .02em;
}
.dashboard-header h1 {
  margin: 0 !important;
  color: var(--ch-purple-dark) !important;
  font-size: clamp(2rem, 3vw, 3rem) !important;
  line-height: 1.1;
}
.notification-button {
  flex: 0 0 auto;
  width: 48px;
  height: 48px;
  border: 1px solid var(--ch-border) !important;
  border-radius: 14px !important;
  background: #fff !important;
  color: var(--ch-purple) !important;
  box-shadow: 0 5px 18px #25145f0d;
  cursor: pointer;
}
.add-card-intro {
  max-width: 1440px;
  margin: 0 auto 24px !important;
  padding: clamp(22px, 3vw, 36px) !important;
  border: 1px solid #e6e5fb;
  border-radius: 22px;
  background: linear-gradient(120deg, #fff 0%, #f5f2ff 100%);
  box-shadow: 0 12px 32px #2a1a6510;
}
.add-card-intro h2 {
  margin: 0 0 10px !important;
  color: var(--ch-purple) !important;
  font-size: clamp(1.4rem, 2vw, 1.9rem) !important;
}
.add-card-intro p {
  margin: 0 !important;
  color: var(--ch-muted);
  font-size: 1.05rem;
  line-height: 1.6;
}
.add-card-form {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto !important;
  padding: clamp(22px, 3.5vw, 42px) !important;
  border: 1px solid var(--ch-border);
  border-radius: 24px;
  background: var(--ch-panel);
  box-shadow: 0 18px 48px #25145f12;
}
#transactionForm {
  display: grid !important;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px 28px !important;
  width: 100%;
}
#transactionForm .form-group {
  display: flex !important;
  flex-direction: column;
  gap: 9px;
  min-width: 0;
  margin: 0 !important;
}
#transactionForm .form-group label {
  color: #30365f !important;
  font-size: .97rem !important;
  font-weight: 700;
}
#transactionForm input,
#transactionForm select,
#transactionForm textarea {
  display: block;
  width: 100% !important;
  min-width: 0;
  min-height: 54px;
  padding: 14px 16px !important;
  border: 1px solid #dcdcf1 !important;
  border-radius: 13px !important;
  background: #fbfbff !important;
  color: var(--ch-ink) !important;
  font: inherit;
  outline: none;
  transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
#transactionForm textarea {
  min-height: 130px;
  resize: vertical;
}
#transactionForm input:focus,
#transactionForm select:focus,
#transactionForm textarea:focus {
  border-color: #7658e8 !important;
  background: #fff !important;
  box-shadow: 0 0 0 4px #7658e81c;
}
#transactionForm .form-buttons {
  grid-column: 1 / -1;
  display: flex !important;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 4px !important;
  padding-top: 22px;
  border-top: 1px solid #eeeeF8;
}
#transactionForm .form-buttons button {
  min-height: 50px;
  padding: 13px 24px !important;
  border-radius: 13px !important;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
#transactionForm .cancel-button {
  border: 1px solid #dedff0 !important;
  background: #fff !important;
  color: #4c5074 !important;
}
#transactionForm .save-card-button {
  border: 1px solid var(--ch-purple) !important;
  background: linear-gradient(135deg, #6545df, #4322b5) !important;
  color: #fff !important;
  box-shadow: 0 8px 18px #4b2bc22a;
}
#transactionForm .save-card-button:disabled {
  opacity: .65;
  cursor: wait;
}
@media (max-width: 980px) {
  :root { --ch-sidebar-width: 200px; }
  main.dashboard { padding: 28px 24px 40px !important; }
}
@media (max-width: 700px) {
  :root { --ch-sidebar-width: 0px; }
  main.dashboard { width: 100% !important; margin: 0 !important; padding: 22px 15px 36px !important; }
  #transactionForm { grid-template-columns: 1fr; gap: 18px !important; }
  .add-card-intro, .add-card-form { padding: 20px !important; border-radius: 18px; }
  #transactionForm .form-buttons { flex-direction: column-reverse; }
  #transactionForm .form-buttons button { width: 100%; }
}
</style>

</head>


<body>

<main class="dashboard">


    <!-- Header -->

    <header class="dashboard-header">

        <div>

            <p class="welcome-text">
                CardHub
            </p>

            <h1>
                Add Transaction
            </h1>

        </div>


        <button
            class="notification-button"
            onclick="window.location.href='transactions.html'"
        >
            ←
        </button>

    </header>



    <!-- Introduction -->

    <section class="add-card-intro">

        <h2>
            Record a transaction
        </h2>

        <p>
            Add your income or expense to CardHub.
        </p>

    </section>



    <!-- Form -->

    <section class="add-card-form">

        <form id="transactionForm">


            <!-- Transaction Type -->

            <div class="form-group">

                <label for="transactionType">
                    Transaction Type
                </label>

                <select
                    id="transactionType"
                    required
                >

                    <option value="">
                        Select type
                    </option>

                    <option value="expense">
                        Expense
                    </option>

                    <option value="income">
                        Income
                    </option>

                </select>

            </div>



            <!-- Amount -->

            <div class="form-group">

                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="₹0"
                    min="1"
                    required
                >

            </div>



            <!-- Merchant -->

            <div class="form-group">

                <label for="merchant">
                    Merchant / Description
                </label>

                <input
                    type="text"
                    id="merchant"
                    placeholder="Example: Amazon"
                    required
                >

            </div>



            <!-- Date -->

            <div class="form-group">

                <label for="transactionDate">
                    Date
                </label>

                <input
                    type="date"
                    id="transactionDate"
                    required
                >

            </div>



            <!-- Card -->

            <div class="form-group">

                <label for="cardName">
                    Card Used
                </label>

                <select
                    id="cardName"
                    required
                >

                    <option value="">
                        Select card
                    </option>

                </select>

            </div>



            <!-- Category -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    required
                >

                    <option value="">
                        Select category
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>



            <!-- Notes -->

            <div class="form-group">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    rows="4"
                    placeholder="Optional notes..."
                ></textarea>

            </div>



            <!-- Buttons -->

            <div class="form-buttons">

                <button
                    type="button"
                    class="cancel-button"
                    onclick="window.location.href='transactions.html'"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="save-card-button"
                >
                    Add Transaction
                </button>

            </div>


        </form>

    </section>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://wrsqhsuktqldnyjrbuma.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const cardSelect =
    document.getElementById("cardName");


/* =========================
   LOAD CARDS FROM SUPABASE
   ========================= */

async function loadCards() {

    const { data, error } =
        await supabaseClient
            .from("cards")
            .select("id, name, issuer")
            .order("name", {
                ascending: true
            });


    if (error) {

        console.error(error);

        alert(
            "Could not load cards.\n\n" +
            error.message
        );

        return;
    }


    cardSelect.innerHTML = `
        <option value="">
            Select card
        </option>
    `;


    (data || []).forEach(function(card) {

        const option =
            document.createElement("option");


        option.value =
            card.id;


        option.textContent =
            card.issuer
                ? card.name + " — " + card.issuer
                : card.name;


        cardSelect.appendChild(option);

    });

}


/* =========================
   TODAY'S DATE
   ========================= */

const today = new Date();
document.getElementById("transactionDate").value = [
    today.getFullYear(),
    String(today.getMonth() + 1).padStart(2, "0"),
    String(today.getDate()).padStart(2, "0")
].join("-");


/* =========================
   SAVE TRANSACTION
   ========================= */

document
    .getElementById("transactionForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const type =
                document.getElementById(
                    "transactionType"
                ).value;


            const amount =
                Number(
                    document.getElementById(
                        "amount"
                    ).value
                );


            const merchant =
                document.getElementById(
                    "merchant"
                ).value.trim();


            const transactionDate =
                document.getElementById(
                    "transactionDate"
                ).value;


            const cardId =
                document.getElementById(
                    "cardName"
                ).value;


            const category =
                document.getElementById(
                    "category"
                ).value;


            const notes =
                document.getElementById(
                    "notes"
                ).value.trim();


            if (
                !type ||
                !amount ||
                amount <= 0 ||
                !merchant ||
                !transactionDate ||
                !cardId ||
                !category
            ) {

                alert(
                    "Please fill all required fields."
                );

                return;

            }


            const submitButton =
                document.querySelector(
                    '#transactionForm button[type="submit"]'
                );


            submitButton.disabled = true;

            submitButton.textContent =
                "Saving...";


            /*
             * Your transactions table currently
             * needs the fields used by the website.
             *
             * card_id links the transaction
             * to the selected Supabase card.
             */

            const transaction = {

                type: type,

                amount: amount,

                merchant: merchant,

                transaction_date: transactionDate,
                date: transactionDate,
                card_id: cardId,
                category: category

            };


            const { error } =
                await supabaseClient
                    .from("transactions")
                    .insert(transaction);


            if (error) {

                console.error(error);

                alert(
                    "Could not save transaction.\n\n" +
                    error.message
                );


                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Add Transaction";

                return;

            }


            alert(
                "Transaction added successfully!"
            );


            window.location.href =
                "transactions.html";

        }
    );


loadCards();

</script>


</body>

</html>
