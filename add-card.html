<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Card - CardHub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >


<style id="cardhub-add-card-sidebar-fix">
/* Match the shared CardHub left sidebar on Add Card */
:root { --ch-sidebar-width: 244px; }
body { margin:0 !important; }
nav.bottom-navigation { position:fixed !important; inset:0 auto 0 0 !important; width:var(--ch-sidebar-width) !important; height:100vh !important; display:flex !important; flex-direction:column !important; justify-content:flex-start !important; align-items:stretch !important; gap:8px !important; padding:92px 14px 20px !important; overflow-y:auto !important; background:linear-gradient(180deg,#111b50 0%,#28136e 100%) !important; border:0 !important; border-radius:0 !important; box-shadow:none !important; z-index:10000 !important; box-sizing:border-box !important; transition:width .2s ease !important; }
nav.bottom-navigation::before { content:'🟣  CardHub'; position:absolute; top:24px; left:24px; color:#fff; font-size:23px; font-weight:800; letter-spacing:-.5px; white-space:nowrap; }
nav.bottom-navigation > a.nav-item { display:flex !important; flex:0 0 auto !important; flex-direction:row !important; align-items:center !important; justify-content:flex-start !important; gap:14px !important; width:100% !important; max-width:none !important; min-width:0 !important; margin:0 !important; padding:15px 14px !important; border-radius:13px !important; color:#f5f5ff !important; text-decoration:none !important; text-align:left !important; box-sizing:border-box !important; }
nav.bottom-navigation > a.nav-item span { display:inline-flex !important; width:24px !important; justify-content:center !important; font-size:19px !important; line-height:1.2 !important; }
nav.bottom-navigation > a.nav-item p { display:block !important; margin:0 !important; font-size:14px !important; line-height:1.3 !important; white-space:nowrap !important; }
nav.bottom-navigation > a.nav-item.active { background:linear-gradient(135deg,#6942ff,#4930ed) !important; color:#fff !important; font-weight:700 !important; box-shadow:0 6px 16px #4930ed40 !important; }
main.dashboard { margin-left:var(--ch-sidebar-width) !important; width:calc(100% - var(--ch-sidebar-width)) !important; max-width:none !important; box-sizing:border-box !important; transition:margin-left .2s ease,width .2s ease !important; }
#cardhubSidebarToggle { position:fixed; z-index:10002; left:205px; top:18px; width:26px; height:26px; border:1px solid #ffffff55; border-radius:7px; color:#fff; background:#ffffff20; cursor:pointer; font-size:16px; }
body.ch-compact { --ch-sidebar-width:78px; }
body.ch-compact nav.bottom-navigation { padding:92px 10px 20px !important; }
body.ch-compact nav.bottom-navigation::before { content:'C'; left:25px; top:24px; font-size:23px; }
body.ch-compact nav.bottom-navigation > a.nav-item { justify-content:center !important; padding:15px 5px !important; }
body.ch-compact nav.bottom-navigation > a.nav-item p { display:none !important; }
body.ch-compact #cardhubSidebarToggle { left:47px; }
@media(max-width:760px) { main.dashboard { padding:18px !important; } nav.bottom-navigation { width:200px !important; } body { --ch-sidebar-width:200px; } body.ch-compact { --ch-sidebar-width:70px; } nav.bottom-navigation::before { left:18px; font-size:20px; } #cardhubSidebarToggle { left:165px; } body.ch-compact #cardhubSidebarToggle { left:40px; } }
</style>

</head>


<body>

<main class="dashboard">


    <!-- =========================
         HEADER
         ========================= -->

    <header class="dashboard-header">

        <div>

            <p class="welcome-text">
                CardHub
            </p>

            <h1>
                Add Card
            </h1>

        </div>


        <button
            class="notification-button"
            onclick="window.location.href='cards.html'"
        >
            ←
        </button>

    </header>



    <!-- =========================
         INTRO
         ========================= -->

    <section class="add-card-intro">

        <h2>
            Add an existing card
        </h2>

        <p>
            Add a card you already own and manage its information
            from CardHub.
        </p>

    </section>



    <!-- =========================
         FORM
         ========================= -->

    <section class="add-card-form">

        <form id="addCardForm">


            <!-- CARD TYPE -->

            <div class="form-group">

                <label for="cardType">
                    Card Type
                </label>

                <select
                    id="cardType"
                    required
                >

                    <option value="">
                        Select card type
                    </option>

                    <option value="credit">
                        Credit Card
                    </option>

                    <option value="debit">
                        Debit Card
                    </option>

                    <option value="prepaid">
                        Prepaid Card
                    </option>

                    <option value="transport">
                        Metro / Transport Card
                    </option>

                    <option value="gift">
                        Gift Card
                    </option>

                    <option value="crypto">
                        Crypto Card
                    </option>

                    <option value="travel">
                        Travel / Forex Card
                    </option>

                    <option value="bus">
                        Private Bus Card
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>

            </div>



            <!-- CARD NAME -->

            <div class="form-group">

                <label for="cardName">
                    Card Name
                </label>

                <input
                    type="text"
                    id="cardName"
                    placeholder="Example: HDFC Millennia Credit Card"
                    required
                >

            </div>



            <!-- ISSUER -->

            <div class="form-group">

                <label for="issuer">
                    Issuer / Provider
                </label>

                <input
                    type="text"
                    id="issuer"
                    placeholder="Example: HDFC Bank"
                    required
                >

            </div>



            <!-- CARD NUMBER -->

            <div class="form-group">

                <label for="cardNumber">
                    Card Number
                </label>

                <input
                    type="text"
                    id="cardNumber"
                    placeholder="Enter card number"
                    maxlength="19"
                    inputmode="numeric"
                    required
                >

            </div>



            <!-- EXPIRY + STATUS -->

            <div class="form-row">


                <div class="form-group">

                    <label for="expiry">
                        Expiry Date
                    </label>

                    <input
                        type="month"
                        id="expiry"
                    >

                </div>



                <div class="form-group">

                    <label for="status">
                        Card Status
                    </label>

                    <select id="status">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>


            </div>



            <!-- NOTES -->

            <div class="form-group">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    rows="4"
                    placeholder="Add notes about this card..."
                ></textarea>

            </div>



            <!-- BUTTONS -->

            <div class="form-buttons">

                <button
                    type="button"
                    class="cancel-button"
                    onclick="window.location.href='cards.html'"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="save-card-button"
                >
                    Add Card
                </button>

            </div>


        </form>

    </section>



    <!-- =========================
         BOTTOM NAVIGATION
         ========================= -->

    <nav class="bottom-navigation">
        <button id="cardhubSidebarToggle" type="button" aria-label="Compact sidebar" title="Compact/expand sidebar">‹</button>


        <a
            href="dashboard.html"
            class="nav-item"
        >

            <span>
                ⌂
            </span>

            <p>
                Home
            </p>

        </a>


        <a
            href="cards.html"
            class="nav-item active"
        >

            <span>
                💳
            </span>

            <p>
                Cards
            </p>

        </a>


        <a
            href="explore.html"
            class="nav-item"
        >

            <span>
                🔎
            </span>

            <p>
                Explore
            </p>

        </a>


        <a
            href="transactions.html"
            class="nav-item"
        >

            <span>
                ↕
            </span>

            <p>
                Transactions
            </p>

        </a>


        <a
            href="profile.html"
            class="nav-item"
        >

            <span>
                👤
            </span>

            <p>
                Profile
            </p>

        </a>


    </nav>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE CONNECTION
   ========================================= */

const SUPABASE_URL =
    "https://wrsqhsuktqldnyjrbuma.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================
   ADD CARD FORM
   ========================================= */

document
    .getElementById("addCardForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            /* =========================
               GET VALUES
               ========================= */

            const type =
                document
                    .getElementById("cardType")
                    .value
                    .trim();


            const name =
                document
                    .getElementById("cardName")
                    .value
                    .trim();


            const issuer =
                document
                    .getElementById("issuer")
                    .value
                    .trim();


            const number =
                document
                    .getElementById("cardNumber")
                    .value
                    .replace(/\s/g, "")
                    .trim();


            const expiry =
                document
                    .getElementById("expiry")
                    .value;


            const status =
                document
                    .getElementById("status")
                    .value;


            const notes =
                document
                    .getElementById("notes")
                    .value
                    .trim();


            /* =========================
               BASIC VALIDATION
               ========================= */

            if (!type) {
                alert("Please select a card type.");
                return;
            }

            if (!name) {
                alert("Please enter the card name.");
                return;
            }

            if (!issuer) {
                alert("Please enter the issuer.");
                return;
            }

            if (!number) {
                alert("Please enter the card number.");
                return;
            }


            /* =========================
               LOAD LOCAL CARDS
               Used to keep the existing
               CardHub pages working.
               ========================= */

            let cards =
                JSON.parse(
                    localStorage.getItem(
                        "cardhubCards"
                    )
                ) || [];


            /* =========================
               DUPLICATE CHECK
               ========================= */

            const duplicate =
                cards.some(
                    function(item) {

                        return (
                            String(item.name)
                                .toLowerCase() ===
                            name.toLowerCase()
                        );

                    }
                );


            if (duplicate) {

                alert(
                    "A card with this name already exists."
                );

                return;

            }


            /* =========================
               SAVE TO SUPABASE
               Only last 4 digits are stored.
               ========================= */

            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();

            if (userError || !user) {
                alert("Please log in again before saving your card.");
                return;
            }

            const { data, error } = await supabaseClient
                .from("cards")
                .insert({
                    user_id: user.id,
                    name: name,
                    type: type,
                    issuer: issuer,
                    number_last4: number.slice(-4),
                    expiry: expiry || null,
                    status: status,
                    notes: notes || null
                })
                .select()
                .single();


            /* =========================
               SUPABASE ERROR
               ========================= */

            if (error) {

                console.error(
                    "Supabase error:",
                    error
                );

                alert(
                    "Could not save card online.\n\n" +
                    error.message
                );

                return;

            }


            /* =========================
               CREATE LOCAL CARD
               Keeps existing CardHub
               pages compatible.
               ========================= */

            const newCard = {

                id:
                    String(data.id),

                type:
                    type,

                name:
                    name,

                issuer:
                    issuer,

                number:
                    "••••" + number.slice(-4),

                expiry:
                    expiry,

                status:
                    status,

                notes:
                    notes

            };


            cards.push(
                newCard
            );


            localStorage.setItem(
                "cardhubCards",
                JSON.stringify(cards)
            );


            /* =========================
               SUCCESS
               ========================= */

            alert(
                "Card added successfully!"
            );


            /* =========================
               OPEN CARD DETAILS
               ========================= */

            window.location.href =
                "card-details.html?id=" +
                encodeURIComponent(
                    newCard.id
                );

        }
    );


/* =========================================
   CARD NUMBER FORMATTING
   ========================================= */

document
    .getElementById("cardNumber")
    .addEventListener(
        "input",
        function() {

            let value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 16);


            let formatted =
                value.match(
                    /.{1,4}/g
                );


            this.value =
                formatted
                    ? formatted.join(" ")
                    : "";

        }
    );

</script>



<script id="cardhub-sidebar-toggle-script">
(function(){
 const key='cardhub-sidebar-compact';
 if(localStorage.getItem(key)==='1') document.body.classList.add('ch-compact');
 const btn=document.getElementById('cardhubSidebarToggle');
 if(btn){ const sync=()=>{btn.textContent=document.body.classList.contains('ch-compact')?'›':'‹';}; sync(); btn.addEventListener('click',()=>{document.body.classList.toggle('ch-compact');localStorage.setItem(key,document.body.classList.contains('ch-compact')?'1':'0');sync();}); }
})();
</script>

</body>

</html>
