<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction - CardHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="dashboard">

    <header class="dashboard-header">
        <div>
            <p class="welcome-text">CardHub</p>
            <h1>Edit Transaction</h1>
        </div>

        <button
            class="notification-button"
            onclick="window.location.href='transactions.html'"
        >
            ←
        </button>
    </header>


    <section class="add-card-intro">

        <h2>Edit transaction</h2>

        <p>
            Update the transaction information and save it to CardHub.
        </p>

    </section>


    <section class="add-card-form">

        <form id="editTransactionForm">

            <div class="form-group">

                <label for="transactionType">
                    Transaction Type
                </label>

                <select id="transactionType" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

            </div>


            <div class="form-group">

                <label for="merchant">
                    Merchant / Description
                </label>

                <input
                    type="text"
                    id="merchant"
                    placeholder="Example: Amazon"
                    required
                >

            </div>


            <div class="form-group">

                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select id="category" required>

                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Travel">Travel</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Education">Education</option>
                    <option value="Transport">Transport</option>
                    <option value="Health">Health</option>
                    <option value="Salary">Salary</option>
                    <option value="Other">Other</option>

                </select>

            </div>


            <div class="form-group">

                <label for="transactionDate">
                    Transaction Date
                </label>

                <input
                    type="date"
                    id="transactionDate"
                    required
                >

            </div>


            <div class="form-buttons">

                <button
                    type="button"
                    class="cancel-button"
                    onclick="window.location.href='transactions.html'"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-card-button"
                    id="saveButton"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </section>


    <nav class="bottom-navigation">

        <a href="dashboard.html" class="nav-item">
            <span>⌂</span>
            <p>Home</p>
        </a>

        <a href="cards.html" class="nav-item">
            <span>💳</span>
            <p>Cards</p>
        </a>

        <a href="explore.html" class="nav-item">
            <span>🔎</span>
            <p>Explore</p>
        </a>

        <a href="transactions.html" class="nav-item active">
            <span>↕</span>
            <p>Transactions</p>
        </a>

        <a href="profile.html" class="nav-item">
            <span>👤</span>
            <p>Profile</p>
        </a>

    </nav>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://wrsqhsuktqldnyjrbuma.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const transactionId =
    new URLSearchParams(window.location.search).get("id");


if (!transactionId) {

    alert("No transaction ID was provided.");

    window.location.href =
        "transactions.html";

}


/* =========================
   LOAD TRANSACTION
   ========================= */

async function loadTransaction() {

    const {
        data: {
            user
        },
        error: authError
    } = await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "index.html";
        return;
    }

    const { data, error } =
        await supabaseClient
            .from("transactions")
            .select("*")
            .eq("id", transactionId)
            .limit(1);


    if (error) {

        console.error("Load transaction error:", error);

        alert(
            "Could not load transaction.\n\n" +
            error.message
        );

        return;
    }


    if (!data || data.length === 0) {

        alert(
            "Transaction not found.\n\n" +
            "ID: " + transactionId
        );

        return;
    }


    const transaction = data[0];


    document.getElementById("transactionType").value =
        transaction.type || "expense";

    document.getElementById("merchant").value =
        transaction.merchant || "";

    document.getElementById("amount").value =
        transaction.amount || "";

    document.getElementById("category").value =
        transaction.category || "";

    document.getElementById("transactionDate").value =
        transaction.transaction_date ||
        transaction.date ||
        "";

}


/* =========================
   UPDATE
   ========================= */

document
    .getElementById("editTransactionForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const saveButton =
            document.getElementById("saveButton");


        const updatedTransaction = {

            type:
                document.getElementById(
                    "transactionType"
                ).value,

            merchant:
                document.getElementById(
                    "merchant"
                ).value.trim(),

            amount:
                Number(
                    document.getElementById(
                        "amount"
                    ).value
                ),

            category:
                document.getElementById(
                    "category"
                ).value,

            transaction_date:
                document.getElementById(
                    "transactionDate"
                ).value

        };


        if (
            !updatedTransaction.merchant ||
            updatedTransaction.amount <= 0 ||
            !updatedTransaction.category ||
            !updatedTransaction.transaction_date
        ) {

            alert("Please fill all required fields.");

            return;

        }


        saveButton.disabled = true;
        saveButton.textContent = "Saving...";


        const { data, error } =
            await supabaseClient
                .from("transactions")
                .update(updatedTransaction)
                .eq("id", transactionId)
                .select();


        if (error) {

            console.error("Update transaction error:", error);

            alert(
                "Could not update transaction.\n\n" +
                error.message
            );

            saveButton.disabled = false;
            saveButton.textContent = "Save Changes";

            return;
        }


        if (!data || data.length === 0) {

            alert(
                "Transaction was found, but Supabase did not update it.\n\n" +
                "You may need an UPDATE RLS policy."
            );

            saveButton.disabled = false;
            saveButton.textContent = "Save Changes";

            return;
        }


        alert("Transaction updated successfully!");

        window.location.href =
            "transactions.html";

    });


loadTransaction();

</script>

</body>
</html>
