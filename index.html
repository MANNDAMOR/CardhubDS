<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CardHub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app">

        <!-- Logo -->
        <div class="brand">
            <div class="logo">C</div>
            <h1>CardHub</h1>
            <p>Your cards. One place.</p>
        </div>

        <!-- Login Card -->
        <section class="login-card">

            <h2>Welcome back</h2>
            <p class="subtitle">Login to manage your cards</p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            id="showPassword"
                            class="show-password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

                <div style="display:flex;align-items:center;gap:10px;margin:18px 0;color:#777;">
                    <span style="flex:1;height:1px;background:#ddd;"></span>
                    <span style="font-size:13px;">OR</span>
                    <span style="flex:1;height:1px;background:#ddd;"></span>
                </div>

                <button
                    type="button"
                    id="googleLoginButton"
                    style="width:100%;padding:12px;border:1px solid #d9d9d9;border-radius:8px;background:#fff;color:#222;font-size:15px;font-weight:600;cursor:pointer;"
                >
                    Continue with Google
                </button>

            </form>

            <p class="register-text">
                Don't have an account?
                <button id="registerButton" class="link-button">
                    Create Account
                </button>
            </p>

        </section>

        <!-- Demo information -->
        <div class="demo-info">
            <span>Semester 3 PBL</span>
            <span>•</span>
            <span>Card Management Platform</span>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/script.js"></script>

</body>
</html>
