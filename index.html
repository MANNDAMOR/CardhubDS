<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#191443">
<title>Log in | CardHub</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<main class="auth-shell">

    <!-- LEFT PANEL -->
    <section class="auth-visual">

        <div class="brand">
            <div class="brand-mark">C</div>
            <span class="brand-name">CardHub</span>
        </div>

        <div class="visual-copy">
            <div class="eyebrow">Welcome back</div>
            <h1>Your cards.<br>One place.</h1>
            <p>
                Log in to see your cards and keep track of your transactions.
            </p>
        </div>

        <div class="visual-card">
            <div class="visual-card-top">
                <span>CardHub</span>
                <span>▰</span>
            </div>
            <div class="chip"></div>
            <div class="visual-card-number">
                •••• &nbsp;•••• &nbsp;•••• &nbsp;5464
            </div>
            <div class="visual-card-bottom">
                <span>YOUR NAME</span>
                <span>MEMBER</span>
            </div>
        </div>

    </section>

    <!-- RIGHT PANEL -->
    <section class="auth-panel">
        <div class="auth-content">

            <div class="brand mobile-brand">
                <div class="brand-mark">C</div>
                <span class="brand-name">CardHub</span>
            </div>

            <h2>Welcome back</h2>
            <p class="auth-subtitle">Log in to manage your cards.</p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" id="showPassword" class="show-password">Show</button>
                    </div>
                </div>

                <button type="submit" class="login-button">Log in</button>

                <div class="divider">OR</div>

                <button type="button" id="googleLoginButton" class="google-button">
                    <span class="google-g">G</span>
                    Continue with Google
                </button>

            </form>

            <p class="register-text">
                Don't have an account?
                <button type="button" id="registerButton" class="link-button">Create account</button>
            </p>

            <div class="auth-foot">
                Semester 3 PBL · Card Management Platform
            </div>

        </div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/script.js"></script>

</body>
</html>
