/* ==========================================
   SAFE HTML
   ========================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================
   GET CARD CATEGORY
   ========================================== */

function getCategory(card) {

    const type =
        String(card.type || "")
            .toLowerCase()
            .trim();


    if (type.includes("credit")) {

        return "credit";

    }


    if (type.includes("debit")) {

        return "debit";

    }


    if (type.includes("prepaid")) {

        return "prepaid";

    }


    if (
        type.includes("transport") ||
        type.includes("ncmc")
    ) {

        return "transport";

    }


    return null;

}

   LOAD EXPLORE CARDS
   ========================================== */

    /* CHECK LOGIN */

    const {

        data: { user },

        error: authError

    } =
        await supabaseClient
            .auth
            .getUser();

        authError ||
        !user
    ) {

        window.location.href =
            "index.html";

        return;

    }


    /* GET EXPLORE CARDS */

    const {

        data,

        error

    } =
        await supabaseClient

            .from("explore_cards")

            .select("*")

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Supabase error:",
            error
        );


        document.getElementById(
            "cardsContainer"
        ).innerHTML = `

            <div class="message">

                <h3>
                    Could not load cards
                </h3>

                <p>
                    ${escapeHtml(error.message)}
                </p>

            </div>

        `;


        document.getElementById(
            "cardCount"
        ).textContent =
            "Could not load cards";


        return;

    }


    /*
       Only allow the four
       Semester 3 card types.
    */

    allCards =
        (data || []).filter(
            function(card) {

                return (
                    getCategory(card) !== null
                );

            }
        );


    renderCards();

}


/* ==========================================
   RENDER CARDS
   ========================================== */

function renderCards() {


    const container =
        document.getElementById(
            "cardsContainer"
        );


    const searchValue =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const filteredCards =
        allCards.filter(
            function(card) {


                const category =
                    getCategory(card);


                /* SEARCH */

                const searchableText = [

                    card.name,

                    card.issuer,

                    card.type,

                    card.reward_rate,

                    card.benefits

                ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                const matchesSearch =
                    !searchValue ||
                    searchableText.includes(
                        searchValue
                    );


                /* FILTER */

                const matchesFilter =
                    currentFilter === "all" ||
                    category === currentFilter;


                return (
                    matchesSearch &&
                    matchesFilter
                );

            }
        );


    /* COUNT */

    document.getElementById(
        "cardCount"
    ).textContent =

        `${filteredCards.length} card${
            filteredCards.length !== 1
                ? "s"
                : ""
        } found`;


    /* EMPTY */

    if (
        filteredCards.length === 0
    ) {

        container.innerHTML = `

            <div class="message">

                <h3>
                    No cards found
                </h3>

                <p>
                    Try another search or filter.
                </p>

            </div>

        `;

        return;

    }


    /* DISPLAY */

    container.innerHTML =

        filteredCards
            .map(
                function(card) {


                    const category =
                        getCategory(card);


                    let displayType =
                        "Card";


                    if (
                        category ===
                        "credit"
                    ) {

                        displayType =
                            "Credit";

                    }


                    else if (
                        category ===
                        "debit"
                    ) {

                        displayType =
                            "Debit";

                    }


                    else if (
                        category ===
                        "prepaid"
                    ) {

                        displayType =
                            "Prepaid";

                    }


                    else if (
                        category ===
                        "transport"
                    ) {

                        displayType =
                            "Transport / NCMC";

                    }


                    return `

                        <div class="explore-card">


                            <!-- CARD VISUAL -->

                            <div class="card-visual">


                                <div class="card-issuer">

                                    ${escapeHtml(
                                        card.issuer ||
                                        "Unknown Issuer"
                                    )}

                                </div>


                                <div class="card-name">

                                    ${escapeHtml(
                                        card.name ||
                                        "Unnamed Card"
                                    )}

                                </div>


                                <div class="card-type">

                                    ${displayType}

                                </div>


                            </div>


                            <!-- FEES -->

                            <div class="card-info">


                                <div class="info-box">

                                    <span>
                                        Annual Fee
                                    </span>

                                    <strong>

                                        ₹${Number(
                                            card.annual_fee ?? 0
                                        ).toLocaleString(
                                            "en-IN"
                                        )}

                                    </strong>

                                </div>


                                <div class="info-box">

                                    <span>
                                        Joining Fee
                                    </span>

                                    <strong>

                                        ₹${Number(
                                            card.joining_fee ?? 0
                                        ).toLocaleString(
                                            "en-IN"
                                        )}

                                    </strong>

                                </div>


                            </div>


                            <!-- REWARD -->

                            <div class="reward">

                                🎁

                                ${escapeHtml(
                                    card.reward_rate ||
                                    "Rewards information unavailable"
                                )}

                            </div>


                            <!-- DETAILS -->

                            <button
                                class="view-button"
                                onclick="viewCard('${encodeURIComponent(card.id)}')"
                            >

                                View Details

                            </button>


                        </div>

                    `;

                }
            )
            .join("");

}


/* ==========================================
   FILTER
   ========================================== */

function setFilter(filter) {


    currentFilter =
        filter;


    document
        .querySelectorAll(
            ".filter-button"
        )
        .forEach(
            function(button) {

                button.classList.remove(
                    "active"
                );

            }
        );


    const activeButton =
        document.querySelector(
            `.filter-button[data-filter="${filter}"]`
        );


    if (activeButton) {

        activeButton.classList.add(
            "active"
        );

    }


    renderCards();

}


/* ==========================================
   SEARCH
   ========================================== */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderCards
    );


/* ==========================================
   VIEW DETAILS
   ========================================== */

function viewCard(cardId) {

    window.location.href =
        "explore-card-details.html?id=" +
        cardId;

}


/* ==========================================
   START
   ========================================== */

loadCards();


</script>
