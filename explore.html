<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore Cards - CardHub</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">

  <style>
    * { box-sizing: border-box; }

    body {
      min-width: 0;
      margin: 0;
      background: #f5f6fc;
      color: #20213a;
      font-family: Inter, Arial, sans-serif;
    }

    .explore-page {
      width: 100%;
      max-width: 1440px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px clamp(16px, 4vw, 48px) 50px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #7255d7;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #211c45;
      font-size: clamp(28px, 4vw, 38px);
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: #77788e;
      font-size: 15px;
    }

    .add-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-radius: 11px;
      background: #6042c5;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .search-box {
      display: flex;
      max-width: 500px;
      min-height: 46px;
      align-items: center;
      gap: 10px;
      margin-bottom: 17px;
      padding: 0 14px;
      border: 1px solid #e5e4ef;
      border-radius: 12px;
      background: #fff;
      color: #85859a;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #20213a;
      font: inherit;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .category-button {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid #e4e2ee;
      border-radius: 999px;
      background: #fff;
      color: #626278;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .category-button.active {
      border-color: #6042c5;
      background: #6042c5;
      color: #fff;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
    }

    .section-heading h2 {
      margin: 0;
      color: #282443;
      font-size: 19px;
    }

    .result-count { color: #77788e; font-size: 13px; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 285px), 1fr));
      gap: 18px;
    }

    .catalog-card {
      overflow: hidden;
      padding: 12px;
      border: 1px solid #e8e7f0;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 24px #28204a0a;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .catalog-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px #28204a16;
    }

    .card-face {
      position: relative;
      display: flex;
      min-height: 174px;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #34245f, #6549bd);
      color: #fff;
    }

    .card-face::after {
      position: absolute;
      right: -24px;
      bottom: -48px;
      width: 145px;
      height: 145px;
      border: 1px solid #ffffff2b;
      border-radius: 50%;
      content: "";
    }

    .catalog-card:nth-child(4n + 2) .card-face {
      background: linear-gradient(135deg, #163c59, #3186a0);
    }

    .catalog-card:nth-child(4n + 3) .card-face {
      background: linear-gradient(135deg, #71364f, #c56878);
    }

    .catalog-card:nth-child(4n + 4) .card-face {
      background: linear-gradient(135deg, #24534b, #5c9b7c);
    }

    .card-face-top,
    .card-face-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .card-type {
      padding: 5px 8px;
      border: 1px solid #ffffff55;
      border-radius: 999px;
      background: #ffffff18;
      font-size: 10px;
      text-transform: uppercase;
    }

    .card-product-name {
      position: relative;
      z-index: 1;
      max-width: 90%;
      margin: 18px 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .card-face-bottom {
      color: #eee9ff;
      font-size: 11px;
    }

    .card-description {
      min-height: 62px;
      margin: 15px 4px 12px;
      color: #66677d;
      font-size: 13px;
      line-height: 1.5;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 4px 14px;
    }

    .tag {
      padding: 5px 8px;
      border-radius: 999px;
      background: #f1edff;
      color: #6042b0;
      font-size: 10px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 4px 3px;
      border-top: 1px solid #efedf5;
    }

    .issuer-label {
      color: #77788e;
      font-size: 11px;
    }

    .apply-link {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border-radius: 9px;
      background: #6042c5;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .apply-link:hover { background: #5033b3; }

    .empty-state {
      grid-column: 1 / -1;
      padding: 34px 20px;
      border: 1px dashed #d9d6e8;
      border-radius: 16px;
      background: #fff;
      color: #77788e;
      text-align: center;
    }

    .empty-state h3 { margin: 0 0 7px; color: #302b4d; }
    .empty-state p { margin: 0; }

    .disclaimer {
      margin: 20px 0 0;
      color: #77788e;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .explore-page { padding: 23px 14px 34px; }
      .page-header { align-items: flex-start; }
      .add-button { min-height: 40px; padding: 0 11px; font-size: 12px; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="explore-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">Discover cards</p>
        <h1>Explore</h1>
        <p class="subtitle">Browse cards by category and apply on the issuer’s website.</p>
      </div>
      <a class="add-button" href="add-card.html">＋ Add My Card</a>
    </header>

    <label class="search-box">
      <span aria-hidden="true">⌕</span>
      <input id="cardSearch" type="search" placeholder="Search cards or issuers…" autocomplete="off">
    </label>

    <nav class="categories" id="categories" aria-label="Filter cards by category">
      <button class="category-button active" type="button" data-category="all" aria-pressed="true">All cards</button>
      <button class="category-button" type="button" data-category="cashback" aria-pressed="false">Cashback</button>
      <button class="category-button" type="button" data-category="shopping" aria-pressed="false">Shopping</button>
      <button class="category-button" type="button" data-category="travel" aria-pressed="false">Travel</button>
      <button class="category-button" type="button" data-category="dining" aria-pressed="false">Dining</button>
      <button class="category-button" type="button" data-category="lifestyle" aria-pressed="false">Lifestyle</button>
    </nav>

    <section>
      <div class="section-heading">
        <h2>Cards you can explore</h2>
        <span class="result-count" id="resultCount"></span>
      </div>
      <div class="cards-grid" id="cardsGrid" aria-live="polite"></div>
      <p class="disclaimer">
        Card details, fees, availability, and eligibility may change. Check the issuer’s website before applying.
        CardHub does not approve applications.
      </p>
    </section>
  </main>

  <script>
    const cards = [
      {
        name: "CASHBACK SBI Card",
        issuer: "SBI Card",
        type: "Credit Card",
        categories: ["cashback", "shopping"],
        icon: "↗",
        description: "Explore the issuer’s current features, fees, eligibility, and application information.",
        applyUrl: "https://www.sbicard.com/en/personal/credit-cards.html"
      },
      {
        name: "Amazon Pay ICICI Bank Credit Card",
        issuer: "ICICI Bank",
        type: "Credit Card",
        categories: ["shopping", "cashback"],
        icon: "◇",
        description: "View current card details and check application eligibility on the issuer’s website.",
        applyUrl: "https://campaigns.icicibank.com/Amazon_pay_ICICI/index.html"
      },
      {
        name: "Flipkart Axis Bank Credit Card",
        issuer: "Axis Bank",
        type: "Credit Card",
        categories: ["shopping", "cashback"],
        icon: "▱",
        description: "Review the issuer’s current terms, features, fees, and application details.",
        applyUrl: "https://cug.axisbank.com/cards/credit-card/flipkart-axisbank-credit-card"
      },
      {
        name: "SBI Card Miles",
        issuer: "SBI Card",
        type: "Travel Credit Card",
        categories: ["travel", "lifestyle"],
        icon: "✈",
        description: "Browse SBI Card travel options and current application information.",
        applyUrl: "https://www.sbicard.com/en/personal/credit-cards.html"
      },
      {
        name: "Axis Bank Neo Credit Card",
        issuer: "Axis Bank",
        type: "Credit Card",
        categories: ["dining", "shopping", "lifestyle"],
        icon: "✦",
        description: "Check current card terms, features, eligibility, and application details.",
        applyUrl: "https://cug.axisbank.com/cards/credit-card/axis-bank-neo-credit-card"
      },
      {
        name: "SimplySAVE SBI Card",
        issuer: "SBI Card",
        type: "Credit Card",
        categories: ["dining", "shopping", "lifestyle"],
        icon: "＋",
        description: "View the issuer’s latest information and application options.",
        applyUrl: "https://www.sbicard.com/en/personal/credit-cards.html"
      }
    ];

    const grid = document.getElementById("cardsGrid");
    const search = document.getElementById("cardSearch");
    const count = document.getElementById("resultCount");
    const buttons = [...document.querySelectorAll(".category-button")];
    let selectedCategory = "all";

    function addText(parent, tag, text, className) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = String(text ?? "");
      parent.appendChild(element);
      return element;
    }

    function renderCards() {
      const query = search.value.trim().toLowerCase();

      const visible = cards.filter(card => {
        const matchesCategory =
          selectedCategory === "all" ||
          card.categories.includes(selectedCategory);

        const searchText =
          `${card.name} ${card.issuer} ${card.type} ${card.categories.join(" ")}`.toLowerCase();

        return matchesCategory && searchText.includes(query);
      });

      count.textContent = `${visible.length} ${visible.length === 1 ? "card" : "cards"}`;

      if (!visible.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        addText(empty, "h3", "No cards found");
        addText(empty, "p", "Try a different search or category.");
        grid.replaceChildren(empty);
        return;
      }

      const fragment = document.createDocumentFragment();

      visible.forEach(card => {
        const article = document.createElement("article");
        article.className = "catalog-card";

        const face = document.createElement("div");
        face.className = "card-face";

        const top = document.createElement("div");
        top.className = "card-face-top";
        addText(top, "span", card.issuer, "card-brand");
        addText(top, "span", card.type, "card-type");

        addText(face, "div", card.name, "card-product-name");

        const bottom = document.createElement("div");
        bottom.className = "card-face-bottom";
        addText(bottom, "span", "CARDHUB");
        addText(bottom, "span", card.icon);
        face.prepend(top);
        face.appendChild(bottom);

        addText(article, "p", card.description, "card-description");

        const tags = document.createElement("div");
        tags.className = "tag-list";
        card.categories.forEach(category => addText(tags, "span", category, "tag"));

        const footer = document.createElement("div");
        footer.className = "card-footer";
        addText(footer, "span", card.issuer, "issuer-label");

        const link = addText(footer, "a", "View & apply →", "apply-link");
        link.href = card.applyUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        article.append(face, tags, footer);
        grid.appendChild(fragment);
        fragment.appendChild(article);
      });

      grid.replaceChildren(fragment);
    }

    search.addEventListener("input", renderCards);

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        selectedCategory = button.dataset.category;
        buttons.forEach(item => {
          const active = item === button;
          item.classList.toggle("active", active);
          item.setAttribute("aria-pressed", String(active));
        });
        renderCards();
      });
    });

    renderCards();
  </script>

  <script src="js/nav.js"></script>
</body>
</html>
