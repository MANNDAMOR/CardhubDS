<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore Cards - CardHub</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">

  <style>
    * { box-sizing: border-box; }

    body {
      min-width: 0;
      margin: 0;
      background: #f5f6fc;
      color: #20213a;
      font-family: Inter, Arial, sans-serif;
    }

    .explore-page {
      width: 100%;
      max-width: 1440px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 36px clamp(18px, 4vw, 52px);
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #7255d7;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #211c45;
      font-size: clamp(28px, 4vw, 38px);
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: #77788e;
      font-size: 15px;
    }

    .add-button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 12px;
      background: #6042c5;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .search-box {
      display: flex;
      max-width: 480px;
      min-height: 48px;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 0 15px;
      border: 1px solid #e5e4ef;
      border-radius: 13px;
      background: #fff;
      color: #85859a;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #20213a;
      font: inherit;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 24px;
    }

    .category-button {
      min-height: 38px;
      padding: 0 15px;
      border: 1px solid #e4e2ee;
      border-radius: 999px;
      background: #fff;
      color: #626278;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .category-button.active {
      border-color: #6042c5;
      background: #6042c5;
      color: #fff;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 15px;
    }

    .section-heading h2 {
      margin: 0;
      color: #282443;
      font-size: 20px;
    }

    .result-count {
      color: #77788e;
      font-size: 13px;
    }

    .offers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr));
      gap: 18px;
    }

    .offer-card {
      display: flex;
      min-height: 220px;
      flex-direction: column;
      padding: 20px;
      border: 1px solid #e8e7f0;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 24px #28204a0a;
    }

    .offer-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .offer-icon {
      display: grid;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      place-items: center;
      border-radius: 14px;
      background: #eee9ff;
      font-size: 22px;
    }

    .offer-card h3 {
      margin: 0;
      color: #292541;
      font-size: 16px;
    }

    .offer-merchant {
      margin: 4px 0 0;
      color: #77788e;
      font-size: 13px;
    }

    .offer-description {
      flex: 1;
      margin: 18px 0;
      color: #66677d;
      font-size: 14px;
      line-height: 1.55;
    }

    .offer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid #efedf5;
    }

    .offer-category {
      color: #7255d7;
      font-size: 12px;
      font-weight: 700;
    }

    .add-card-link {
      color: #6042c5;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 34px 20px;
      border: 1px dashed #d9d6e8;
      border-radius: 16px;
      background: #fff;
      color: #77788e;
      text-align: center;
    }

    .empty-state h3 {
      margin: 0 0 7px;
      color: #302b4d;
    }

    .empty-state p { margin: 0; }

    @media (max-width: 600px) {
      .explore-page { padding: 24px 15px 34px; }
      .page-header { align-items: flex-start; }
      .add-button { min-height: 42px; padding: 0 12px; font-size: 13px; }
      .offers-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="explore-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">Discover</p>
        <h1>Explore</h1>
        <p class="subtitle">Find card offers and useful ways to make the most of your cards.</p>
      </div>
      <a class="add-button" href="add-card.html">＋ Add Card</a>
    </header>

    <label class="search-box">
      <span aria-hidden="true">⌕</span>
      <input id="offerSearch" type="search" placeholder="Search offers…" autocomplete="off">
    </label>

    <nav class="categories" aria-label="Filter offers">
      <button class="category-button active" type="button" data-category="all">All</button>
      <button class="category-button" type="button" data-category="shopping">Shopping</button>
      <button class="category-button" type="button" data-category="food">Food</button>
      <button class="category-button" type="button" data-category="travel">Travel</button>
      <button class="category-button" type="button" data-category="entertainment">Entertainment</button>
    </nav>

    <section>
      <div class="section-heading">
        <h2>Featured offers</h2>
        <span class="result-count" id="resultCount"></span>
      </div>
      <div class="offers-grid" id="offersGrid" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const offers = [
      {
        title: "Save on everyday shopping",
        merchant: "Retail offers",
        category: "shopping",
        icon: "🛍️",
        description: "Check your card provider’s current shopping rewards and discounts before you buy."
      },
      {
        title: "Dining rewards",
        merchant: "Food and dining",
        category: "food",
        icon: "🍽️",
        description: "Look for dining cashback, reward points, and partner restaurant offers on your cards."
      },
      {
        title: "Plan your next trip",
        merchant: "Travel benefits",
        category: "travel",
        icon: "✈️",
        description: "Explore travel rewards, airport benefits, and partner deals available through your card."
      },
      {
        title: "Entertainment perks",
        merchant: "Movies and events",
        category: "entertainment",
        icon: "🎟️",
        description: "Check for movie, concert, and subscription offers linked to your card provider."
      },
      {
        title: "Compare card benefits",
        merchant: "CardHub guide",
        category: "all",
        icon: "💳",
        description: "Review your saved cards and compare the benefits that matter most to you."
      },
      {
        title: "Keep your wallet organized",
        merchant: "CardHub tip",
        category: "all",
        icon: "✨",
        description: "Add your cards to CardHub so you can find their details quickly in one place."
      }
    ];

    const grid = document.getElementById("offersGrid");
    const search = document.getElementById("offerSearch");
    const count = document.getElementById("resultCount");
    const buttons = [...document.querySelectorAll(".category-button")];
    let selectedCategory = "all";

    function addText(parent, tag, text, className) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      parent.appendChild(element);
      return element;
    }

    function renderOffers() {
      const query = search.value.trim().toLowerCase();
      const visible = offers.filter(offer => {
        const matchesCategory =
          selectedCategory === "all" ||
          offer.category === selectedCategory ||
          offer.category === "all";

        const matchesSearch =
          `${offer.title} ${offer.merchant} ${offer.description} ${offer.category}`
            .toLowerCase()
            .includes(query);

        return matchesCategory && matchesSearch;
      });

      count.textContent = `${visible.length} ${visible.length === 1 ? "offer" : "offers"}`;

      if (!visible.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        addText(empty, "h3", "No offers found");
        addText(empty, "p", "Try another search or category.");
        grid.replaceChildren(empty);
        return;
      }

      const fragment = document.createDocumentFragment();

      visible.forEach(offer => {
        const card = document.createElement("article");
        card.className = "offer-card";

        const top = document.createElement("div");
        top.className = "offer-top";
        addText(top, "span", offer.icon, "offer-icon");

        const titleWrap = document.createElement("div");
        addText(titleWrap, "h3", offer.title);
        addText(titleWrap, "p", offer.merchant, "offer-merchant");
        top.appendChild(titleWrap);

        addText(card, "p", offer.description, "offer-description");

        const bottom = document.createElement("div");
        bottom.className = "offer-bottom";
        addText(bottom, "span", offer.category === "all" ? "CardHub" : offer.category, "offer-category");

        const link = addText(bottom, "a", "Add a card →", "add-card-link");
        link.href = "add-card.html";

        card.prepend(top);
        card.appendChild(bottom);
        fragment.appendChild(card);
      });

      grid.replaceChildren(fragment);
    }

    search.addEventListener("input", renderOffers);

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        selectedCategory = button.dataset.category;
        buttons.forEach(item => item.classList.toggle("active", item === button));
        renderOffers();
      });
    });

    renderOffers();
  </script>

  <script src="js/nav.js"></script>
</body>
</html>
