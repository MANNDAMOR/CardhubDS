<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cards - CardHub</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav.css">

<style id="cardhub-shared-layout-fix">
    main.dashboard {
        margin-left: 250px !important;
        width: auto !important;
        max-width: none !important;
        box-sizing: border-box;
    }
    @media (max-width: 800px) {
        main.dashboard {
            margin-left: 0 !important;
        }
    }
</style>
</head>

<body>

    <main class="dashboard">

        <!-- Header -->
        <header class="dashboard-header">
            <div>
                <p class="welcome-text">CardHub</p>
                <h1>My Cards</h1>
            </div>

            <button
                class="notification-button"
                onclick="window.location.href='dashboard.html'"
            >
                ←
            </button>
        </header>


        <!-- Add Card -->
        <section class="add-card-banner">

            <div>
                <h2>Add an existing card</h2>
                <p>
                    Keep all your cards together in one place.
                </p>
            </div>

            <button
                class="add-card-button"
                onclick="window.location.href='add-card.html'"
            >
                + Add Card
            </button>

        </section>


        <!-- Search -->
        <div class="card-search">

            <span>🔎</span>

            <input
                type="text"
                id="cardSearch"
                placeholder="Search your cards..."
            >

        </div>


        <!-- Filters -->
        <div class="filter-row">

            <button class="filter-button active" data-filter="all">
                All
            </button>

            <button class="filter-button" data-filter="credit">
                Credit
            </button>

            <button class="filter-button" data-filter="debit">
                Debit
            </button>

            <button class="filter-button" data-filter="prepaid">
                Prepaid
            </button>

            <button class="filter-button" data-filter="transport">
                Transport
            </button>

        </div>


        <!-- Cards -->
        <section class="my-cards-list" id="myCardsList">
        </section>


        <!-- Bottom Navigation -->
        

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        /* =========================================
           SUPABASE CONNECTION
           ========================================= */

        const SUPABASE_URL =
            "https://wrsqhsuktqldnyjrbuma.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================
           ELEMENTS
           ========================================= */

        const cardsList =
            document.getElementById("myCardsList");

        const searchInput =
            document.getElementById("cardSearch");

        const filterButtons =
            document.querySelectorAll(".filter-button");


        let allCards = [];

        let selectedFilter = "all";


        /* =========================================
           DISPLAY CARDS
           ========================================= */

        function displayCards(cards) {

            cardsList.innerHTML = "";


            if (cards.length === 0) {

                cardsList.innerHTML = `
                    <div class="empty-cards">

                        <h3>No cards found</h3>

                        <p>
                            Add your first card to CardHub.
                        </p>

                        <button
                            class="add-card-button"
                            onclick="window.location.href='add-card.html'"
                        >
                            + Add Card
                        </button>

                    </div>
                `;

                return;
            }


            cards.forEach(function(card) {

                const cardElement =
                    document.createElement("div");


                cardElement.className =
                    "user-card-item";


                cardElement.onclick =
                    function() {

                        window.location.href =
                            "card-details.html?id=" +
                            encodeURIComponent(card.id);

                    };


                const lastFour =
                    card.number_last4 ||
                    (
                        card.number
                            ? String(card.number).slice(-4)
                            : "----"
                    );


                const status =
                    card.status ||
                    "Active";


                const type =
                    card.type ||
                    "other";


                cardElement.innerHTML = `

                    <div class="mini-card credit-card">

                        <div class="mini-card-top">

                            <span>
                                CardHub
                            </span>

                            <span>
                                💳
                            </span>

                        </div>


                        <div class="mini-card-number">

                            •••• ${lastFour}

                        </div>


                        <div class="mini-card-bottom">

                            <span>
                                ${escapeHtml(card.issuer || "Unknown")}
                            </span>

                            <span>
                                ${escapeHtml(status).toUpperCase()}
                            </span>

                        </div>

                    </div>


                    <div class="user-card-info">

                        <h3>
                            ${escapeHtml(card.name || "Unnamed Card")}
                        </h3>

                        <p>
                            ${escapeHtml(type)} •
                            ${escapeHtml(card.issuer || "Unknown")}
                        </p>

                        <span class="active-badge">
                            ${escapeHtml(status)}
                        </span>

                    </div>


                    <span class="card-arrow">
                        ›
                    </span>

                `;


                cardsList.appendChild(
                    cardElement
                );

            });

        }


        /* =========================================
           ESCAPE HTML
           ========================================= */

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================
           FILTER + SEARCH
           ========================================= */

        function updateCards() {

            const searchValue =
                searchInput.value
                    .toLowerCase()
                    .trim();


            const filteredCards =
                allCards.filter(
                    function(card) {

                        const name =
                            String(
                                card.name || ""
                            ).toLowerCase();


                        const issuer =
                            String(
                                card.issuer || ""
                            ).toLowerCase();


                        const type =
                            String(
                                card.type || ""
                            ).toLowerCase();


                        const searchMatch =
                            name.includes(searchValue) ||
                            issuer.includes(searchValue);


                        let filterMatch = true;


                        if (
                            selectedFilter !==
                            "all"
                        ) {

                            if (
                                selectedFilter ===
                                "transport"
                            ) {

                                filterMatch =
                                    type ===
                                    "transport" ||
                                    type === "bus";

                            } else {

                                filterMatch =
                                    type ===
                                    selectedFilter;

                            }

                        }


                        return (
                            searchMatch &&
                            filterMatch
                        );

                    }
                );


            displayCards(
                filteredCards
            );

        }


        /* =========================================
           SEARCH
           ========================================= */

        if (searchInput) {

            searchInput.addEventListener(
                "input",
                updateCards
            );

        }


        /* =========================================
           FILTER BUTTONS
           ========================================= */

        filterButtons.forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        filterButtons.forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                        button.classList.add(
                            "active"
                        );


                        selectedFilter =
                            button.dataset.filter;


                        updateCards();

                    }
                );

            }
        );


        /* =========================================
           LOAD CARDS FROM SUPABASE
           ========================================= */

        async function loadCards() {

            cardsList.innerHTML = `

                <div class="empty-cards">

                    <h3>
                        Loading cards...
                    </h3>

                    <p>
                        Connecting to CardHub database.
                    </p>

                </div>

            `;


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("cards")
                    .select("*")
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(
                    "Supabase error:",
                    error
                );


                cardsList.innerHTML = `

                    <div class="empty-cards">

                        <h3>
                            Could not load cards
                        </h3>

                        <p>
                            ${escapeHtml(
                                error.message
                            )}
                        </p>

                        <button
                            class="add-card-button"
                            onclick="loadCards()"
                        >
                            Try Again
                        </button>

                    </div>

                `;

                return;

            }


            allCards =
                data || [];


            updateCards();

        }


        /* =========================================
           START
           ========================================= */

        loadCards();

    </script>

    <script src="js/nav.js"></script>
</body>
</html>
