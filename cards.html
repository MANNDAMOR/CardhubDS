<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Cards - CardHub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >


<style id="cardhub-desktop-page">
/* CardHub desktop website theme for card pages */
html { min-width: 1024px; }
body { min-width: 1024px; background: #f3f6fb; color: #17243b; }
main.dashboard {
  width: auto; max-width: none; min-height: 100vh;
  margin: 0; padding: 34px 46px 54px 282px;
  box-sizing: border-box;
}
.dashboard-header {
  max-width: 1500px; margin: 0 auto 28px;
  padding: 0 0 22px; border-bottom: 1px solid #e5eaf2;
}
.dashboard-header h1 { color: #17243b; font-size: 32px; letter-spacing: -.035em; }
.dashboard-header .welcome-text { color: #7a8597; font-size: 14px; }
.notification-button {
  border: 1px solid #e5eaf2; border-radius: 14px; background: #fff;
  box-shadow: 0 5px 18px rgba(23,36,59,.06);
}
.add-card-banner, .details-card, .details-section, .card-search,
.filter-row, .my-cards-list {
  max-width: 1500px; margin-left: auto; margin-right: auto;
}
.add-card-banner {
  padding: 28px 32px; border-radius: 20px; margin-bottom: 24px;
  box-shadow: 0 10px 28px rgba(23,36,59,.07);
}
.card-search { margin-top: 22px; margin-bottom: 18px; }
.card-search input { min-height: 50px; border-radius: 12px; }
.filter-row { gap: 10px; margin-bottom: 26px; }
.filter-button { border-radius: 10px; padding: 11px 20px; }
.my-cards-list {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px; align-items: stretch;
}
.user-card-item {
  min-width: 0; padding: 20px; border-radius: 18px;
  background: #fff; border: 1px solid #e5eaf2;
  box-shadow: 0 8px 26px rgba(23,36,59,.055);
  transition: transform .18s ease, box-shadow .18s ease;
}
.user-card-item:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 32px rgba(23,36,59,.11);
}
.mini-card { width: 100%; box-sizing: border-box; border-radius: 15px; }
.user-card-info { padding-top: 18px; }
.card-arrow { font-size: 24px; }
.details-card {
  width: 100%; max-width: 720px; box-sizing: border-box;
  margin: 0 0 26px; padding: 30px 34px; border-radius: 22px;
  box-shadow: 0 18px 40px rgba(20,30,50,.14);
}
.details-card-number { font-size: 26px; letter-spacing: .12em; margin: 34px 0; }
.details-section {
  width: 100%; box-sizing: border-box; margin-top: 24px; padding: 26px 28px;
  border: 1px solid #e5eaf2; border-radius: 18px; background: #fff;
  box-shadow: 0 8px 26px rgba(23,36,59,.045);
}
.details-section h2 { margin-top: 0; margin-bottom: 20px; font-size: 21px; color: #182742; }
.details-actions { gap: 12px; }
.info-box { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.info-row { min-width: 0; padding: 16px 0; border-bottom: 1px solid #edf0f5; }
.info-row strong { overflow-wrap: anywhere; text-align: right; }
.benefits-box { border-radius: 14px; }
.transaction-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.transaction-list .transaction { min-width: 0; border: 1px solid #edf0f5; border-radius: 12px; padding: 16px; }
.security-warning { border-radius: 14px; padding: 20px; }
.bottom-navigation {
  position: fixed; inset: 0 auto 0 0; transform: none;
  width: 230px; max-width: none; height: 100vh; box-sizing: border-box;
  padding: 34px 18px; background: #fff; border: 0; border-right: 1px solid #e5eaf2;
  border-radius: 0; box-shadow: 8px 0 30px rgba(23,36,59,.035);
  display: flex; flex-direction: column; justify-content: flex-start;
  align-items: stretch; gap: 10px; z-index: 100;
}
.bottom-navigation::before {
  content: "CARDHUB"; display: block; padding: 8px 14px 30px;
  color: #17243b; font-size: 22px; font-weight: 800; letter-spacing: .08em;
}
.nav-item {
  display: flex; align-items: center; gap: 14px; min-width: 0;
  padding: 14px 15px; border-radius: 12px; text-align: left; color: #69768b;
}
.nav-item:hover, .nav-item.active { color: #17243b; background: #eef3fa; }
.nav-item span { width: 24px; margin: 0; text-align: center; font-size: 19px; }
.nav-item p { font-size: 14px; font-weight: 600; }
@media (min-width: 1400px) {
  .details-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
}
</style>

</head>


<body>


<main class="dashboard">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="dashboard-header">

        <div>

            <p class="welcome-text">
                CardHub
            </p>

            <h1>
                My Cards
            </h1>

        </div>


        <button
            class="notification-button"
            onclick="window.location.href='dashboard.html'"
        >
            ←
        </button>

    </header>



    <!-- =========================
         ADD CARD
    ========================== -->

    <section class="add-card-banner">

        <div>

            <h2>
                Add an existing card
            </h2>

            <p>
                Keep all your cards together in one place.
            </p>

        </div>


        <button
            class="add-card-button"
            onclick="window.location.href='add-card.html'"
        >
            + Add Card
        </button>

    </section>



    <!-- =========================
         SEARCH
    ========================== -->

    <div class="card-search">

        <span>
            🔎
        </span>

        <input
            type="text"
            id="cardSearch"
            placeholder="Search your cards..."
        >

    </div>



    <!-- =========================
         FILTERS
    ========================== -->

    <div class="filter-row">


        <button
            class="filter-button active"
            data-filter="all"
        >
            All
        </button>


        <button
            class="filter-button"
            data-filter="credit"
        >
            Credit
        </button>


        <button
            class="filter-button"
            data-filter="debit"
        >
            Debit
        </button>


        <button
            class="filter-button"
            data-filter="prepaid"
        >
            Prepaid
        </button>


        <button
            class="filter-button"
            data-filter="transport"
        >
            Transport/NCMC
        </button>


    </div>



    <!-- =========================
         CARDS
    ========================== -->

    <section
        class="my-cards-list"
        id="myCardsList"
    >

        <!-- Cards loaded by JavaScript -->

    </section>



    <!-- =========================
         BOTTOM NAVIGATION
    ========================== -->

    <nav class="bottom-navigation">


        <a
            href="dashboard.html"
            class="nav-item"
        >

            <span>
                ⌂
            </span>

            <p>
                Home
            </p>

        </a>


        <a
            href="cards.html"
            class="nav-item active"
        >

            <span>
                💳
            </span>

            <p>
                Cards
            </p>

        </a>


        <a
            href="explore.html"
            class="nav-item"
        >

            <span>
                🔎
            </span>

            <p>
                Explore
            </p>

        </a>


        <a
            href="transactions.html"
            class="nav-item"
        >

            <span>
                ↕
            </span>

            <p>
                Transactions
            </p>

        </a>


        <a
            href="profile.html"
            class="nav-item"
        >

            <span>
                👤
            </span>

            <p>
                Profile
            </p>

        </a>


    </nav>


</main>



<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* ==============================
   SUPABASE CONNECTION
============================== */

const SUPABASE_URL =
    "https://wrsqhsuktqldnyjrbuma.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



/* ==============================
   ELEMENTS
============================== */

const cardsList =
    document.getElementById(
        "myCardsList"
    );


const searchInput =
    document.getElementById(
        "cardSearch"
    );


const filterButtons =
    document.querySelectorAll(
        ".filter-button"
    );


let allCards = [];

let selectedFilter = "all";



/* ==============================
   ESCAPE HTML
============================== */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==============================
   NORMALIZE CARD TYPE
============================== */

function normalizeCardType(type) {

    const value =
        String(type || "")
            .toLowerCase()
            .trim();


    if (value === "credit") {
        return "credit";
    }


    if (value === "debit") {
        return "debit";
    }


    if (value === "prepaid") {
        return "prepaid";
    }


    if (
        value === "transport" ||
        value === "ncmc"
    ) {

        return "transport";

    }


    return "";

}



/* ==============================
   DISPLAY CARDS
============================== */

function displayCards(cards) {


    cardsList.innerHTML = "";


    if (cards.length === 0) {


        cardsList.innerHTML = `

            <div class="empty-cards">

                <h3>
                    No cards found
                </h3>

                <p>
                    Add your first card to CardHub.
                </p>

                <button
                    class="add-card-button"
                    onclick="window.location.href='add-card.html'"
                >
                    + Add Card
                </button>

            </div>

        `;


        return;

    }



    cards.forEach(
        function(card) {


            const cardElement =
                document.createElement(
                    "div"
                );


            cardElement.className =
                "user-card-item";


            cardElement.onclick =
                function() {

                    window.location.href =
                        "card-details.html?id=" +
                        encodeURIComponent(
                            card.id
                        );

                };



            /* LAST FOUR */

            const lastFour =
                card.number_last4 ||
                (
                    card.number
                        ? String(
                            card.number
                        ).slice(-4)
                        : "----"
                );



            /* STATUS */

            const status =
                card.status ||
                "Active";



            /* TYPE */

            const type =
                normalizeCardType(
                    card.type
                );



            const displayType =
                type === "transport"
                    ? "Transport/NCMC"
                    : (
                        type
                            ? type.charAt(0).toUpperCase() +
                              type.slice(1)
                            : "Card"
                    );



            const issuerName = String(card.issuer || "CardHub");
            const cardName = String(card.name || "Unnamed Card");
            const themeKey = /axis/i.test(issuerName + " " + cardName) ? "axis" :
                /sbi/i.test(issuerName + " " + cardName) ? "sbi" :
                /amazon/i.test(issuerName + " " + cardName) ? "amazon" :
                /icici/i.test(issuerName + " " + cardName) ? "icici" :
                /indusind/i.test(issuerName + " " + cardName) ? "indusind" :
                /delta|crypto/i.test(issuerName + " " + cardName) ? "delta" :
                type === "debit" ? "debit" : type === "prepaid" ? "prepaid" :
                type === "transport" ? "transport" : "classic";

            const network = /mastercard/i.test(cardName) ? "mastercard" :
                /visa/i.test(cardName) ? "visa" : "";
            const cardholder = card.cardholder_name || card.cardholder || "CARDHOLDER";

            cardElement.innerHTML = `
                <div class="mini-card realistic-card sketch-card theme-${themeKey}">
                    <div class="real-card-top">
                        <div class="real-card-issuer">
                            <span class="real-card-bank-mark" aria-hidden="true">${escapeHtml((issuerName || "CH").slice(0, 2).toUpperCase())}</span>
                            <span>${escapeHtml(issuerName || "BANK NAME")}</span>
                        </div>
                        <span class="real-card-contactless" aria-label="NFC contactless">)))</span>
                    </div>
                    <div class="real-card-chip-row">
                        <div class="real-card-chip" aria-label="Gold chip"><i></i><b></b><em></em></div>
                    </div>
                    <div class="real-card-bottom">
                        <span class="real-cardholder">${escapeHtml(cardholder).toUpperCase()}</span>
                        <span class="real-card-network ${network}">${network ? escapeHtml(network.toUpperCase()) : "CARD"}</span>
                    </div>
                    <span class="real-card-number">•••• ${escapeHtml(lastFour)}</span>
                </div>

                <div class="user-card-info">
                    <h3>${escapeHtml(cardName)}</h3>
                    <p>${escapeHtml(displayType)} <span aria-hidden="true">•</span> ${escapeHtml(issuerName)}</p>
                    <span class="active-badge">${escapeHtml(status)}</span>
                </div>
                <span class="card-arrow" aria-hidden="true">›</span>
            `;


            cardsList.appendChild(
                cardElement
            );


        }
    );

}



/* ==============================
   SEARCH + FILTER
============================== */

function updateCards() {


    const searchValue =
        searchInput.value
            .toLowerCase()
            .trim();



    const filteredCards =
        allCards.filter(
            function(card) {


                const name =
                    String(
                        card.name || ""
                    ).toLowerCase();


                const issuer =
                    String(
                        card.issuer || ""
                    ).toLowerCase();


                const type =
                    normalizeCardType(
                        card.type
                    );


                const searchMatch =
                    name.includes(
                        searchValue
                    ) ||
                    issuer.includes(
                        searchValue
                    );


                let filterMatch =
                    true;



                if (
                    selectedFilter !==
                    "all"
                ) {

                    filterMatch =
                        type ===
                        selectedFilter;

                }



                return (
                    searchMatch &&
                    filterMatch
                );


            }
        );



    displayCards(
        filteredCards
    );

}



/* ==============================
   SEARCH
============================== */

searchInput.addEventListener(
    "input",
    updateCards
);



/* ==============================
   FILTER BUTTONS
============================== */

filterButtons.forEach(
    function(button) {


        button.addEventListener(
            "click",
            function() {


                filterButtons.forEach(
                    function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                selectedFilter =
                    button.dataset.filter;


                updateCards();

            }
        );

    }
);



/* ==============================
   LOAD CARDS
============================== */

async function loadCards() {


    cardsList.innerHTML = `

        <div class="empty-cards">

            <h3>
                Loading cards...
            </h3>

            <p>
                Connecting to CardHub database.
            </p>

        </div>

    `;



    /* =========================
       CHECK LOGIN
    ========================= */

    const {
        data: {
            user
        },
        error: authError

    } =
        await supabaseClient.auth.getUser();



    if (
        authError ||
        !user
    ) {

        window.location.href =
            "index.html";

        return;

    }



    /* =========================
       LOAD USER CARDS
    ========================= */

    const {
        data,
        error

    } =
        await supabaseClient

            .from("cards")

            .select("*")

            .eq(
                "user_id",
                user.id
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );



    /* =========================
       DATABASE ERROR
    ========================= */

    if (error) {


        console.error(
            "Supabase error:",
            error
        );


        cardsList.innerHTML = `

            <div class="empty-cards">

                <h3>
                    Could not load cards
                </h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>


                <button
                    class="add-card-button"
                    onclick="loadCards()"
                >
                    Try Again
                </button>

            </div>

        `;


        return;

    }



    /* =========================
       KEEP ONLY SEM 3 TYPES
    ========================= */

    allCards =
        (data || []).filter(
            function(card) {

                return (
                    normalizeCardType(
                        card.type
                    ) !== ""
                );

            }
        );



    /* =========================
       LOCAL STORAGE SYNC
    ========================= */

    const localCards =
        allCards.map(
            function(card) {

                return {

                    id:
                        String(
                            card.id
                        ),

                    user_id:
                        card.user_id,

                    type:
                        normalizeCardType(
                            card.type
                        ),

                    name:
                        card.name,

                    issuer:
                        card.issuer,

                    number:
                        "••••" +
                        (
                            card.number_last4 ||
                            "----"
                        ),

                    number_last4:
                        card.number_last4,

                    expiry:
                        card.expiry,

                    status:
                        card.status,

                    notes:
                        card.notes

                };

            }
        );



    localStorage.setItem(
        "cardhubCards",
        JSON.stringify(
            localCards
        )
    );



    /* =========================
       DISPLAY
    ========================= */

    updateCards();

}



/* ==============================
   START
============================== */

loadCards();


</script>


</body>

</html>

<style id="cardhub-sketch-card-layout">
/* Card layout based on your sketch: bank at top-left, NFC top-right,
   gold chip at left, and card network at bottom-right. */
#myCardsList .user-card-item {
    display: block;
    padding: 0;
    overflow: hidden;
    border: 0;
    background: transparent;
    box-shadow: none;
}
#myCardsList .user-card-item:hover {
    transform: translateY(-3px);
    box-shadow: none;
}
#myCardsList .realistic-card.sketch-card {
    width: 100%;
    aspect-ratio: 1.586 / 1;
    min-height: 0;
    height: auto;
    padding: 7.5% 7%;
    border-radius: 18px;
    color: #202735;
    background: linear-gradient(145deg, #ffffff 0%, #f8fafc 62%, #edf1f6 100%);
    border: 1px solid #d7deea;
    box-shadow: 0 9px 24px rgba(28, 42, 66, .12), inset 0 1px 0 rgba(255,255,255,.95);
    overflow: hidden;
}
#myCardsList .realistic-card.sketch-card::before {
    content: "";
    position: absolute;
    inset: 0;
    width: auto;
    height: auto;
    right: auto;
    top: auto;
    border: 0;
    background: linear-gradient(125deg, rgba(255,255,255,.78), transparent 50%);
    pointer-events: none;
}
#myCardsList .sketch-card .real-card-top {
    align-items: flex-start;
    min-height: 20%;
}
#myCardsList .sketch-card .real-card-issuer {
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: 78%;
    color: #252f40;
    font-size: clamp(10px, 1vw, 15px);
    font-weight: 700;
    letter-spacing: .025em;
}
#myCardsList .sketch-card .real-card-bank-mark {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    width: 25px;
    height: 25px;
    border-radius: 7px;
    color: #fff;
    background: linear-gradient(145deg, #536782, #172a45);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0;
}
#myCardsList .sketch-card .real-card-contactless {
    display: inline-block;
    color: #53657e;
    font-size: clamp(18px, 2vw, 28px);
    font-weight: 700;
    line-height: 1;
    transform: rotate(90deg);
    letter-spacing: -7px;
    padding-right: 7px;
}
#myCardsList .sketch-card .real-card-chip-row {
    justify-content: flex-start;
    margin-top: auto;
    margin-bottom: auto;
}
#myCardsList .sketch-card .real-card-chip {
    width: clamp(38px, 4.4vw, 58px);
    height: clamp(28px, 3.3vw, 43px);
    border-radius: 7px;
    background: linear-gradient(135deg, #fff0bd, #d3aa54 42%, #f8df9c 70%, #b78635);
    border: 1px solid #b58b3e;
    box-shadow: inset 0 1px 2px rgba(255,255,255,.9), 0 1px 2px rgba(40,40,40,.1);
}
#myCardsList .sketch-card .real-card-chip i,
#myCardsList .sketch-card .real-card-chip b,
#myCardsList .sketch-card .real-card-chip em {
    border-color: rgba(132, 94, 33, .75);
}
#myCardsList .sketch-card .real-card-bottom {
    position: absolute;
    left: 7%;
    right: 7%;
    bottom: 7%;
    align-items: flex-end;
}
#myCardsList .sketch-card .real-cardholder {
    max-width: 55%;
    color: #6a7483;
    font-size: clamp(8px, .8vw, 11px);
    letter-spacing: .08em;
    overflow-wrap: anywhere;
}
#myCardsList .sketch-card .real-card-network {
    color: #253b5c;
    font-size: clamp(12px, 1.2vw, 18px);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -.035em;
}
#myCardsList .sketch-card .real-card-network.mastercard {
    font-size: clamp(9px, .9vw, 13px);
    font-style: normal;
}
#myCardsList .sketch-card .real-card-number {
    position: absolute;
    left: 7%;
    bottom: 23%;
    color: #7d8796;
    font-size: clamp(8px, .85vw, 12px);
    letter-spacing: .12em;
}
#myCardsList .sketch-card .real-card-orb,
#myCardsList .sketch-card .real-card-status {
    display: none !important;
}
#myCardsList .user-card-info {
    padding: 13px 4px 0;
}
#myCardsList .card-arrow {
    display: none;
}
@media (max-width: 700px) {
    #myCardsList .realistic-card.sketch-card {
        border-radius: 14px;
        padding: 7%;
    }
    #myCardsList .sketch-card .real-card-issuer {
        font-size: 10px;
    }
    #myCardsList .sketch-card .real-card-bank-mark {
        width: 21px;
        height: 21px;
    }
}
</style>
