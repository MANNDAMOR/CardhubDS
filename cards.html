<style id="cardhub-desktop-page">
/* CardHub desktop website theme for card pages */
html { min-width: 1024px; }
body { min-width: 1024px; background: #f3f6fb; color: #17243b; }
main.dashboard {
  width: auto; max-width: none; min-height: 100vh;
  margin: 0; padding: 34px 46px 54px 282px;
  box-sizing: border-box;
}
.dashboard-header {
  max-width: 1500px; margin: 0 auto 28px;
  padding: 0 0 22px; border-bottom: 1px solid #e5eaf2;
}
.dashboard-header h1 { color: #17243b; font-size: 32px; letter-spacing: -.035em; }
.dashboard-header .welcome-text { color: #7a8597; font-size: 14px; }
.notification-button {
  border: 1px solid #e5eaf2; border-radius: 14px; background: #fff;
  box-shadow: 0 5px 18px rgba(23,36,59,.06);
}
.add-card-banner, .details-card, .details-section, .card-search,
.filter-row, .my-cards-list {
  max-width: 1500px; margin-left: auto; margin-right: auto;
}
.add-card-banner {
  padding: 28px 32px; border-radius: 20px; margin-bottom: 24px;
  box-shadow: 0 10px 28px rgba(23,36,59,.07);
}
.card-search { margin-top: 22px; margin-bottom: 18px; }
.card-search input { min-height: 50px; border-radius: 12px; }
.filter-row { gap: 10px; margin-bottom: 26px; }
.filter-button { border-radius: 10px; padding: 11px 20px; }
.my-cards-list {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px; align-items: stretch;
}
.user-card-item {
  min-width: 0; padding: 20px; border-radius: 18px;
  background: #fff; border: 1px solid #e5eaf2;
  box-shadow: 0 8px 26px rgba(23,36,59,.055);
  transition: transform .18s ease, box-shadow .18s ease;
}
.user-card-item:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 32px rgba(23,36,59,.11);
}
.mini-card { width: 100%; box-sizing: border-box; border-radius: 15px; }
.user-card-info { padding-top: 18px; }
.card-arrow { font-size: 24px; }
.details-card {
  width: 100%; max-width: 720px; box-sizing: border-box;
  margin: 0 0 26px; padding: 30px 34px; border-radius: 22px;
  box-shadow: 0 18px 40px rgba(20,30,50,.14);
}
.details-card-number { font-size: 26px; letter-spacing: .12em; margin: 34px 0; }
.details-section {
  width: 100%; box-sizing: border-box; margin-top: 24px; padding: 26px 28px;
  border: 1px solid #e5eaf2; border-radius: 18px; background: #fff;
  box-shadow: 0 8px 26px rgba(23,36,59,.045);
}
.details-section h2 { margin-top: 0; margin-bottom: 20px; font-size: 21px; color: #182742; }
.details-actions { gap: 12px; }
.info-box { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.info-row { min-width: 0; padding: 16px 0; border-bottom: 1px solid #edf0f5; }
.info-row strong { overflow-wrap: anywhere; text-align: right; }
.benefits-box { border-radius: 14px; }
.transaction-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.transaction-list .transaction { min-width: 0; border: 1px solid #edf0f5; border-radius: 12px; padding: 16px; }
.security-warning { border-radius: 14px; padding: 20px; }
.bottom-navigation {
  position: fixed; inset: 0 auto 0 0; transform: none;
  width: 230px; max-width: none; height: 100vh; box-sizing: border-box;
  padding: 34px 18px; background: #fff; border: 0; border-right: 1px solid #e5eaf2;
  border-radius: 0; box-shadow: 8px 0 30px rgba(23,36,59,.035);
  display: flex; flex-direction: column; justify-content: flex-start;
  align-items: stretch; gap: 10px; z-index: 100;
}
.bottom-navigation::before {
  content: "CARDHUB"; display: block; padding: 8px 14px 30px;
  color: #17243b; font-size: 22px; font-weight: 800; letter-spacing: .08em;
}
.nav-item {
  display: flex; align-items: center; gap: 14px; min-width: 0;
  padding: 14px 15px; border-radius: 12px; text-align: left; color: #69768b;
}
.nav-item:hover, .nav-item.active { color: #17243b; background: #eef3fa; }
.nav-item span { width: 24px; margin: 0; text-align: center; font-size: 19px; }
.nav-item p { font-size: 14px; font-weight: 600; }
@media (min-width: 1400px) {
  .details-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
}
</style>

.cardhub-user{margin-top:20px;border-top:1px solid #ffffff18;padding:16px 10px 0;display:flex;align-items:center;gap:11px}.cardhub-avatar{width:39px;height:39px;border-radius:50%;background:#e8ddff;color:#4c2bb4;display:grid;place-items:center;font-weight:800;flex-shrink:0}.cardhub-user strong{display:block;font-size:13px;color:white}.cardhub-user small{display:block;font-size:11px;color:#aaa1d8;margin-top:4px}
body{padding-left:var(--ch-side-width)!important}

@media(max-width:760px){.cardhub-sidebar{width:220px;transform:translateX(-100%);transition:transform .2s}.cardhub-sidebar.open{transform:translateX(0)}body{padding-left:0!important}.ch-mobile-menu{display:block!important}.ch-sidebar-overlay.show{display:block}}

.ch-sidebar-overlay{display:none;position:fixed;inset:0;background:#100b3577;z-index:999}
</style>
</head>


<body>
<aside class="cardhub-sidebar" id="cardhubSidebar"><div class="cardhub-brand"><span class="cardhub-brand-icon">▱</span><span>CardHub</span></div><div class="cardhub-nav-label">WORKSPACE</div><nav class="cardhub-nav"><a href="dashboard.html" class=""><span class="ch-icon">▦</span><span>Dashboard</span></a><a href="cards.html" class="active"><span class="ch-icon">▱</span><span>Cards</span></a><a href="transactions.html" class=""><span class="ch-icon">⇄</span><span>Transactions</span></a><a href="explore.html" class=""><span class="ch-icon">◎</span><span>Explore</span></a></nav><section class="cardhub-account"><div class="cardhub-nav-label">ACCOUNT</div><div class="cardhub-quick"><a href="profile.html"><span class="ch-icon">⚙</span><span>Settings &amp; Profile</span></a><a href="add-card.html"><span class="ch-icon">⊕</span><span>Add Card</span></a><a href="add-transaction.html"><span class="ch-icon">⊕</span><span>Add Transaction</span></a></div><div class="cardhub-user"><div class="cardhub-avatar" id="chSidebarAvatar">CH</div><div><strong id="chSidebarName">My CardHub</strong><small>Personal account</small></div></div></section></aside><div class="ch-sidebar-overlay" id="chSidebarOverlay"></div>


<main class="dashboard">


    <!-- =========================

        <div>

    <section class="add-card-banner">

            </p>

        <button
            class="add-card-button"

        </button>

<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* ==============================
   SUPABASE CONNECTION
============================== */

const SUPABASE_URL =
    "https://wrsqhsuktqldnyjrbuma.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



/* ==============================
   ELEMENTS
============================== */

const cardsList =
    document.getElementById(
        "myCardsList"
    );


const searchInput =
    document.getElementById(
        "cardSearch"
    );


const filterButtons =
    document.querySelectorAll(
        ".filter-button"
    );


let allCards = [];

let selectedFilter = "all";



/* ==============================
   ESCAPE HTML
============================== */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==============================
   NORMALIZE CARD TYPE
============================== */

function normalizeCardType(type) {

    const value =
        String(type || "")
            .toLowerCase()
            .trim();


    if (value === "credit") {
        return "credit";
    }


    if (value === "debit") {
        return "debit";
    }


    if (value === "prepaid") {
        return "prepaid";
    }


    if (
        value === "transport" ||
        value === "ncmc"
    ) {

        return "transport";

    }


    return "";

}



/* ==============================
   DISPLAY CARDS
============================== */

function displayCards(cards) {


    cardsList.innerHTML = "";


    if (cards.length === 0) {


        cardsList.innerHTML = `

            <div class="empty-cards">

                <h3>
                    No cards found
                </h3>

                <p>
                    Add your first card to CardHub.
                </p>

                <button
                    class="add-card-button"
                    onclick="window.location.href='add-card.html'"
                >
                    + Add Card
                </button>

            </div>

        `;


        return;

    }



    cards.forEach(
        function(card) {


            const cardElement =
                document.createElement(
                    "div"
                );


            cardElement.className =
                "user-card-item";


            cardElement.onclick =
                function() {

                    window.location.href =
                        "card-details.html?id=" +
                        encodeURIComponent(
                            card.id
                        );

                };



            /* LAST FOUR */

            const lastFour =
                card.number_last4 ||
                (
                    card.number
                        ? String(
                            card.number
                        ).slice(-4)
                        : "----"
                );



            /* STATUS */

            const status =
                card.status ||
                "Active";



            /* TYPE */

            const type =
                normalizeCardType(
                    card.type
                );



            const displayType =
                type === "transport"
                    ? "Transport/NCMC"
                    : (
                        type
                            ? type.charAt(0).toUpperCase() +
                              type.slice(1)
                            : "Card"
                    );



            cardElement.innerHTML = `


                <div class="mini-card credit-card">


                    <div class="mini-card-top">

                        <span>
                            CardHub
                        </span>

                        <span>
                            💳
                        </span>

                    </div>



                    <div class="mini-card-number">

                        •••• ${escapeHtml(
                            lastFour
                        )}

                    </div>



                    <div class="mini-card-bottom">


                        <span>

                            ${escapeHtml(
                                card.issuer ||
                                "Unknown"
                            )}

                        </span>


                        <span>

                            ${escapeHtml(
                                status
                            ).toUpperCase()}

                        </span>


                    </div>


                </div>



                <div class="user-card-info">


                    <h3>

                        ${escapeHtml(
                            card.name ||
                            "Unnamed Card"
                        )}

                    </h3>


                    <p>

                        ${escapeHtml(
                            displayType
                        )}

                        •
                        
                        ${escapeHtml(
                            card.issuer ||
                            "Unknown"
                        )}

                    </p>


                    <span class="active-badge">

                        ${escapeHtml(
                            status
                        )}

                    </span>


                </div>



                <span class="card-arrow">
                    ›
                </span>


            `;



            cardsList.appendChild(
                cardElement
            );


        }
    );

}



/* ==============================
   SEARCH + FILTER
============================== */

function updateCards() {


    const searchValue =
        searchInput.value
            .toLowerCase()
            .trim();



    const filteredCards =
        allCards.filter(
            function(card) {


                const name =
                    String(
                        card.name || ""
                    ).toLowerCase();


                const issuer =
                    String(
                        card.issuer || ""
                    ).toLowerCase();


                const type =
                    normalizeCardType(
                        card.type
                    );


                const searchMatch =
                    name.includes(
                        searchValue
                    ) ||
                    issuer.includes(
                        searchValue
                    );


                let filterMatch =
                    true;



                if (
                    selectedFilter !==
                    "all"
                ) {

                    filterMatch =
                        type ===
                        selectedFilter;

                }



                return (
                    searchMatch &&
                    filterMatch
                );


            }
        );



    displayCards(
        filteredCards
    );

}



/* ==============================
   SEARCH
============================== */

searchInput.addEventListener(
    "input",
    updateCards
);



/* ==============================
   FILTER BUTTONS
============================== */

filterButtons.forEach(
    function(button) {


        button.addEventListener(
            "click",
            function() {


                filterButtons.forEach(
                    function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                selectedFilter =
                    button.dataset.filter;


                updateCards();

            }
        );

    }
);



/* ==============================
   LOAD CARDS
============================== */

async function loadCards() {


    cardsList.innerHTML = `

        <div class="empty-cards">

            <h3>
                Loading cards...
            </h3>

            <p>
                Connecting to CardHub database.
            </p>

        </div>

    `;



    /* =========================
       CHECK LOGIN
    ========================= */

    const {
        data: {
            user
        },
        error: authError

    } =
        await supabaseClient.auth.getUser();



    if (
        authError ||
        !user
    ) {

        window.location.href =
            "index.html";

        return;

    }



    /* =========================
       LOAD USER CARDS
    ========================= */

    const {
        data,
        error

    } =
        await supabaseClient

            .from("cards")

            .select("*")

            .eq(
                "user_id",
                user.id
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );



    /* =========================
       DATABASE ERROR
    ========================= */

    if (error) {


        console.error(
            "Supabase error:",
            error
        );


        cardsList.innerHTML = `

            <div class="empty-cards">

                <h3>
                    Could not load cards
                </h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>


                <button
                    class="add-card-button"
                    onclick="loadCards()"
                >
                    Try Again
                </button>

            </div>

        `;


        return;

    }



    /* =========================
       KEEP ONLY SEM 3 TYPES
    ========================= */

    allCards =
        (data || []).filter(
            function(card) {

                return (
                    normalizeCardType(
                        card.type
                    ) !== ""
                );

            }
        );



    /* =========================
       LOCAL STORAGE SYNC
    ========================= */

    const localCards =
        allCards.map(
            function(card) {

                return {

                    id:
                        String(
                            card.id
                        ),

                    user_id:
                        card.user_id,

                    type:
                        normalizeCardType(
                            card.type
                        ),

                    name:
                        card.name,

                    issuer:
                        card.issuer,

                    number:
                        "••••" +
                        (
                            card.number_last4 ||
                            "----"
                        ),

                    number_last4:
                        card.number_last4,

                    expiry:
                        card.expiry,

                    status:
                        card.status,

                    notes:
                        card.notes

                };

            }
        );



    localStorage.setItem(
        "cardhubCards",
        JSON.stringify(
            localCards
        )
    );



    /* =========================
       DISPLAY
    ========================= */

    updateCards();

}



/* ==============================
   START
============================== */

loadCards();


</script>


<script id="cardhub-sidebar-controls">
(function(){
 const side=document.getElementById('cardhubSidebar'), overlay=document.getElementById('chSidebarOverlay');
 if(!side||!overlay)return;
 const btn=document.createElement('button');btn.className='ch-mobile-menu';btn.type='button';btn.textContent='☰';btn.setAttribute('aria-label','Open navigation');
 const heading=document.querySelector('h1');
 if(heading&&heading.parentElement){heading.parentElement.insertBefore(btn,heading);}
 btn.addEventListener('click',()=>{side.classList.add('open');overlay.classList.add('show')});
 overlay.addEventListener('click',()=>{side.classList.remove('open');overlay.classList.remove('show')});
 const name=document.getElementById('welcomeName');
 const userName=document.getElementById('chSidebarName');
 if(name&&userName)userName.textContent=name.textContent.replace(/\\s*👋\\s*$/,'')||'My CardHub';
})();
</script>
</body>
