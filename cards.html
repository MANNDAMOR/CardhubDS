<style id="cardhub-desktop-page">
/* CardHub desktop website theme for card pages */
html { min-width: 1024px; }
body { min-width: 1024px; background: #f3f6fb; color: #17243b; }
main.dashboard {
  width: auto; max-width: none; min-height: 100vh;
  margin: 0; padding: 34px 46px 54px 282px;
  box-sizing: border-box;
}
.dashboard-header {
  max-width: 1500px; margin: 0 auto 28px;
  padding: 0 0 22px; border-bottom: 1px solid #e5eaf2;
}
.dashboard-header h1 { color: #17243b; font-size: 32px; letter-spacing: -.035em; }
.dashboard-header .welcome-text { color: #7a8597; font-size: 14px; }
.notification-button {
  border: 1px solid #e5eaf2; border-radius: 14px; background: #fff;
  box-shadow: 0 5px 18px rgba(23,36,59,.06);
}
.add-card-banner, .details-card, .details-section, .card-search,
.filter-row, .my-cards-list {
  max-width: 1500px; margin-left: auto; margin-right: auto;
}
.add-card-banner {
  padding: 28px 32px; border-radius: 20px; margin-bottom: 24px;
  box-shadow: 0 10px 28px rgba(23,36,59,.07);
}
.card-search { margin-top: 22px; margin-bottom: 18px; }
.card-search input { min-height: 50px; border-radius: 12px; }
.filter-row { gap: 10px; margin-bottom: 26px; }
.filter-button { border-radius: 10px; padding: 11px 20px; }
.my-cards-list {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px; align-items: stretch;
}
.user-card-item {
  min-width: 0; padding: 20px; border-radius: 18px;
  background: #fff; border: 1px solid #e5eaf2;
  box-shadow: 0 8px 26px rgba(23,36,59,.055);
  transition: transform .18s ease, box-shadow .18s ease;
}
.user-card-item:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 32px rgba(23,36,59,.11);
}
.mini-card { width: 100%; box-sizing: border-box; border-radius: 15px; }
.user-card-info { padding-top: 18px; }
.card-arrow { font-size: 24px; }
.details-card {
  width: 100%; max-width: 720px; box-sizing: border-box;
  margin: 0 0 26px; padding: 30px 34px; border-radius: 22px;
  box-shadow: 0 18px 40px rgba(20,30,50,.14);
}
.details-card-number { font-size: 26px; letter-spacing: .12em; margin: 34px 0; }
.details-section {
  width: 100%; box-sizing: border-box; margin-top: 24px; padding: 26px 28px;
  border: 1px solid #e5eaf2; border-radius: 18px; background: #fff;
  box-shadow: 0 8px 26px rgba(23,36,59,.045);
}
.details-section h2 { margin-top: 0; margin-bottom: 20px; font-size: 21px; color: #182742; }
.details-actions { gap: 12px; }
.info-box { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.info-row { min-width: 0; padding: 16px 0; border-bottom: 1px solid #edf0f5; }
.info-row strong { overflow-wrap: anywhere; text-align: right; }
.benefits-box { border-radius: 14px; }
.transaction-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.transaction-list .transaction { min-width: 0; border: 1px solid #edf0f5; border-radius: 12px; padding: 16px; }
.security-warning { border-radius: 14px; padding: 20px; }
.bottom-navigation {
  position: fixed; inset: 0 auto 0 0; transform: none;
  width: 230px; max-width: none; height: 100vh; box-sizing: border-box;
  padding: 34px 18px; background: #fff; border: 0; border-right: 1px solid #e5eaf2;
  border-radius: 0; box-shadow: 8px 0 30px rgba(23,36,59,.035);
  display: flex; flex-direction: column; justify-content: flex-start;
  align-items: stretch; gap: 10px; z-index: 100;
}
.bottom-navigation::before {
  content: "CARDHUB"; display: block; padding: 8px 14px 30px;
  color: #17243b; font-size: 22px; font-weight: 800; letter-spacing: .08em;
}
.nav-item {
  display: flex; align-items: center; gap: 14px; min-width: 0;
  padding: 14px 15px; border-radius: 12px; text-align: left; color: #69768b;
}
.nav-item:hover, .nav-item.active { color: #17243b; background: #eef3fa; }
.nav-item span { width: 24px; margin: 0; text-align: center; font-size: 19px; }
.nav-item p { font-size: 14px; font-weight: 600; }
@media (min-width: 1400px) {
  .details-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
}
</style>

:root{--ch-ink:#17243b;--ch-muted:#748096;--ch-bg:#f3f6fb;--ch-panel:#fff;--ch-border:#e5eaf3;--ch-blue:#4169e1;--ch-purple:#7c4dff;--ch-cyan:#22b8cf;--ch-green:#17a673;--ch-shadow:0 12px 32px rgba(31,52,94,.08)}

main.dashboard,.dashboard{width:100%;max-width:none;margin:0 auto}
.dashboard-header,header.dashboard-header,.modern-header{gap:16px}

/* Common page sections and surfaces */
section,.profile-section,.transactions-section,.transaction-add-box,.transaction-summary,.cards-section,.explore-section{border-radius:22px}
.card,.summary-box,.transaction-summary .summary-box,.transaction-add-box,.transaction-search,.transactions-section,.profile-section,.security-card,.logout-card,.account-card,.info-card,.stat-card,.section-card,.filter-panel,.search-container,.search-box,.card-item,.explore-card,.transaction-card{border:1px solid rgba(222,230,243,.9);box-shadow:var(--ch-shadow)}
input:not([type=checkbox]):not([type=radio]):not([type=submit]),select,textarea{max-width:100%;border:1px solid #dfe6f1;border-radius:13px;background:#fff;color:var(--ch-ink);outline:none;transition:border-color .18s,box-shadow .18s}

button:hover,.button:hover,a.button:hover,.add-transaction-button:hover{filter:brightness(1.03);transform:translateY(-1px)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(65,105,225,.35);outline-offset:3px}
/* Bright accents consistent with the Dashboard */
.summary-box:first-child,.stat-card:nth-child(4n+1){background:linear-gradient(135deg,#fff,#f0f4ff)}
.summary-box:nth-child(2),.stat-card:nth-child(4n+2){background:linear-gradient(135deg,#fff,#effcf8)}
.summary-box:nth-child(3),.stat-card:nth-child(4n+3){background:linear-gradient(135deg,#fff,#fff5ed)}
.summary-box:nth-child(4),.stat-card:nth-child(4n){background:linear-gradient(135deg,#fff,#f8f1ff)}
.add-transaction-button,.primary-button,.logout-button{border:0;border-radius:13px;background:linear-gradient(135deg,var(--ch-blue),var(--ch-purple));color:#fff;font-weight:700;box-shadow:0 8px 18px rgba(65,105,225,.2)}
.logout-button{background:linear-gradient(135deg,#e84d68,#c73555)}
.bottom-navigation{backdrop-filter:blur(16px);background:rgba(255,255,255,.94)!important;border-top:1px solid var(--ch-border)!important;box-shadow:0 -8px 24px rgba(31,52,94,.06)}
.bottom-navigation .nav-item{border-radius:13px;color:#78849a;transition:background .2s,color .2s}
.bottom-navigation .nav-item.active{background:#edf1ff;color:var(--ch-blue);font-weight:750}
.bottom-navigation .nav-item span{font-size:19px}
.empty-state{border:1px dashed #d5deed;background:linear-gradient(135deg,#fff,#f7f9ff);border-radius:18px}
/* Responsive layout: remove old forced desktop width */
@media(max-width:900px){
  main.dashboard,.dashboard{padding-left:0!important;margin-left:0!important}
  .dashboard-header,header.dashboard-header{align-items:center}
  .sidebar,.desktop-sidebar,.sidebar-navigation{display:none!important}
  .bottom-navigation{position:fixed;z-index:1000;left:0;right:0;bottom:0;display:flex;justify-content:space-around;gap:3px;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));}
  .bottom-navigation .nav-item{flex:1;min-width:0;text-align:center;padding:7px 2px;text-decoration:none}
  .bottom-navigation .nav-item p{font-size:10px;margin:3px 0 0;white-space:nowrap}

}
@media(max-width:600px){
  .dashboard-header,header.dashboard-header{margin-bottom:18px}
  h1{font-size:clamp(23px,6vw,30px)}
  .transaction-summary,.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
  .transaction-add-box{display:flex;flex-wrap:wrap;gap:14px;padding:18px!important}
  .transaction-add-box button{width:100%}

  .transaction-search input{width:100%;min-width:0}
  .profile-section,.transactions-section{padding:16px!important}
  table{display:block;max-width:100%;overflow-x:auto}
}

     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* ==============================
   SUPABASE CONNECTION
============================== */

const SUPABASE_URL =
    "https://wrsqhsuktqldnyjrbuma.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



/* ==============================
   ELEMENTS
============================== */

const cardsList =
    document.getElementById(
        "myCardsList"
    );


const searchInput =
    document.getElementById(
        "cardSearch"
    );


const filterButtons =
    document.querySelectorAll(
        ".filter-button"
    );


let allCards = [];

let selectedFilter = "all";



/* ==============================
   ESCAPE HTML
============================== */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==============================
   NORMALIZE CARD TYPE
============================== */

function normalizeCardType(type) {

    const value =
        String(type || "")
            .toLowerCase()
            .trim();


    if (value === "credit") {
        return "credit";
    }


    if (value === "debit") {
        return "debit";
    }


    if (value === "prepaid") {
        return "prepaid";
    }


    if (
        value === "transport" ||
        value === "ncmc"
    ) {

        return "transport";

    }


    return "";

}



/* ==============================
   DISPLAY CARDS
============================== */

function displayCards(cards) {


    cardsList.innerHTML = "";


    if (cards.length === 0) {


        cardsList.innerHTML = `

            <div class="empty-cards">

                <h3>
                    No cards found
                </h3>

                <p>
                    Add your first card to CardHub.
                </p>

                <button
                    class="add-card-button"
                    onclick="window.location.href='add-card.html'"
                >
                    + Add Card
                </button>

            </div>

        `;


        return;

    }



    cards.forEach(
        function(card) {


            const cardElement =
                document.createElement(
                    "div"
                );


            cardElement.className =
                "user-card-item";


            cardElement.onclick =
                function() {

                    window.location.href =
                        "card-details.html?id=" +
                        encodeURIComponent(
                            card.id
                        );

                };



            /* LAST FOUR */

            const lastFour =
                card.number_last4 ||
                (
                    card.number
                        ? String(
                            card.number
                        ).slice(-4)
                        : "----"
                );



            /* STATUS */

            const status =
                card.status ||
                "Active";



            /* TYPE */

            const type =
                normalizeCardType(
                    card.type
                );



            const displayType =
                type === "transport"
                    ? "Transport/NCMC"
                    : (
                        type
                            ? type.charAt(0).toUpperCase() +
                              type.slice(1)
                            : "Card"
                    );



            const issuerName = String(card.issuer || "CardHub");
            const cardName = String(card.name || "Unnamed Card");
            const themeKey = /axis/i.test(issuerName + " " + cardName) ? "axis" :
                /sbi/i.test(issuerName + " " + cardName) ? "sbi" :
                /amazon/i.test(issuerName + " " + cardName) ? "amazon" :
                /icici/i.test(issuerName + " " + cardName) ? "icici" :
                /indusind/i.test(issuerName + " " + cardName) ? "indusind" :
                /delta|crypto/i.test(issuerName + " " + cardName) ? "delta" :
                type === "debit" ? "debit" : type === "prepaid" ? "prepaid" :
                type === "transport" ? "transport" : "classic";

            const network = /mastercard/i.test(cardName) ? "mastercard" :
                /visa/i.test(cardName) ? "visa" : "";
            const cardholder = card.cardholder_name || card.cardholder || "CARDHOLDER";

            cardElement.innerHTML = `
                <div class="mini-card realistic-card sketch-card theme-${themeKey}">
                    <div class="real-card-top">
                        <div class="real-card-issuer">
                            <span class="real-card-bank-mark" aria-hidden="true">${escapeHtml((issuerName || "CH").slice(0, 2).toUpperCase())}</span>
                            <span>${escapeHtml(issuerName || "BANK NAME")}</span>
                        </div>
                        <span class="real-card-contactless" aria-label="NFC contactless">)))</span>
                    </div>
                    <div class="real-card-chip-row">
                        <div class="real-card-chip" aria-label="Gold chip"><i></i><b></b><em></em></div>
                    </div>
                    <div class="real-card-bottom">
                        <span class="real-cardholder">${escapeHtml(cardholder).toUpperCase()}</span>
                        <span class="real-card-network ${network}">${network ? escapeHtml(network.toUpperCase()) : "CARD"}</span>
                    </div>
                    <span class="real-card-number">•••• ${escapeHtml(lastFour)}</span>
                </div>

                <div class="user-card-info">
                    <h3>${escapeHtml(cardName)}</h3>
                    <p>${escapeHtml(displayType)} <span aria-hidden="true">•</span> ${escapeHtml(issuerName)}</p>
                    <span class="active-badge">${escapeHtml(status)}</span>
                </div>
                <span class="card-arrow" aria-hidden="true">›</span>
            `;


            cardsList.appendChild(
                cardElement
            );


        }
    );

}



/* ==============================
   SEARCH + FILTER
============================== */

function updateCards() {


    const searchValue =
        searchInput.value
            .toLowerCase()
            .trim();



    const filteredCards =
        allCards.filter(
            function(card) {


                const name =
                    String(
                        card.name || ""
                    ).toLowerCase();


                const issuer =
                    String(
                        card.issuer || ""
                    ).toLowerCase();


                const type =
                    normalizeCardType(
                        card.type
                    );


                const searchMatch =
                    name.includes(
                        searchValue
                    ) ||
                    issuer.includes(
                        searchValue
                    );


                let filterMatch =
                    true;



                if (
                    selectedFilter !==
                    "all"
                ) {

                    filterMatch =
                        type ===
                        selectedFilter;

                }



                return (
                    searchMatch &&
                    filterMatch
                );


            }
        );



    displayCards(
        filteredCards
    );

}



/* ==============================
   SEARCH
============================== */

searchInput.addEventListener(
    "input",
    updateCards
);



/* ==============================
   FILTER BUTTONS
============================== */

filterButtons.forEach(
    function(button) {


        button.addEventListener(
            "click",
            function() {


                filterButtons.forEach(
                    function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                selectedFilter =
                    button.dataset.filter;


                updateCards();

            }
        );

    }
);



/* ==============================
   LOAD CARDS
============================== */

async function loadCards() {


    cardsList.innerHTML = `

        <div class="empty-cards">

            <h3>
                Loading cards...
            </h3>

            <p>
                Connecting to CardHub database.
            </p>

        </div>

    `;



    /* =========================
       CHECK LOGIN
    ========================= */

    const {
        data: {
            user
        },
        error: authError

    } =
        await supabaseClient.auth.getUser();



    if (
        authError ||
        !user
    ) {

        window.location.href =
            "index.html";

        return;

    }



    /* =========================
       LOAD USER CARDS
    ========================= */

    const {
        data,
        error

    } =
        await supabaseClient

            .from("cards")

            .select("*")

            .eq(
                "user_id",
                user.id
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );



    /* =========================
       DATABASE ERROR
    ========================= */

    if (error) {


        console.error(
            "Supabase error:",
            error
        );


        cardsList.innerHTML = `

            <div class="empty-cards">

                <h3>
                    Could not load cards
                </h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>


                <button
                    class="add-card-button"
                    onclick="loadCards()"
                >
                    Try Again
                </button>

            </div>

        `;


        return;

    }



    /* =========================
       KEEP ONLY SEM 3 TYPES
    ========================= */

    allCards =
        (data || []).filter(
            function(card) {

                return (
                    normalizeCardType(
                        card.type
                    ) !== ""
                );

            }
        );



    /* =========================
       LOCAL STORAGE SYNC
    ========================= */

    const localCards =
        allCards.map(
            function(card) {

                return {

                    id:
                        String(
                            card.id
                        ),

                    user_id:
                        card.user_id,

                    type:
                        normalizeCardType(
                            card.type
                        ),

                    name:
                        card.name,

                    issuer:
                        card.issuer,

                    number:
                        "••••" +
                        (
                            card.number_last4 ||
                            "----"
                        ),

                    number_last4:
                        card.number_last4,

                    expiry:
                        card.expiry,

                    status:
                        card.status,

                    notes:
                        card.notes

                };

            }
        );



    localStorage.setItem(
        "cardhubCards",
        JSON.stringify(
            localCards
        )
    );



    /* =========================
       DISPLAY
    ========================= */

    updateCards();

}



/* ==============================
   START
============================== */

loadCards();


</script>
