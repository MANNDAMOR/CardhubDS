<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transactions - CardHub</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">

  <style>
    * { box-sizing: border-box; }

    body {
      min-width: 0;
      margin: 0;
      background: #f5f6fc;
      color: #24213b;
      font-family: Inter, Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1440px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 32px clamp(16px, 4vw, 48px) 48px;
    }

    .page-header,
    .section-heading,
    .filters,
    .transaction,
    .transaction-actions {
      display: flex;
      align-items: center;
    }

    .page-header,
    .section-heading {
      justify-content: space-between;
      gap: 16px;
    }

    .page-header { margin-bottom: 24px; }

    .eyebrow {
      margin: 0 0 6px;
      color: #7656d6;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 { margin: 0; color: #211c45; font-size: clamp(27px, 3vw, 35px); }
    .subtitle { margin: 8px 0 0; color: #77788e; }

    .button {
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid #e4e2ee;
      border-radius: 11px;
      background: white;
      color: #51427d;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .button-primary { border-color: #6042c5; background: #6042c5; color: white; }
    .button-danger { color: #b43d55; }
    .button:disabled { opacity: .6; cursor: wait; }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat, .panel {
      border: 1px solid #e8e7f0;
      border-radius: 16px;
      background: white;
      box-shadow: 0 8px 24px #28204a0a;
    }

    .stat { padding: 18px; }
    .stat-label { color: #77788e; font-size: 13px; }
    .stat-value { margin-top: 9px; color: #292541; font-size: 25px; font-weight: 800; }

    .panel { overflow: hidden; }

    .section-heading {
      padding: 20px 20px 14px;
    }

    .section-heading h2 { margin: 0; color: #292541; font-size: 18px; }
    .result-count { color: #77788e; font-size: 13px; }

    .filters {
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 20px 18px;
    }

    .control {
      min-width: 130px;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #e4e2ee;
      border-radius: 10px;
      background: white;
      color: #302d48;
      font: inherit;
      font-size: 13px;
    }

    .search-control { flex: 1 1 230px; }
    .filters select { flex: 1 1 140px; }
    .clear-button { flex: 0 0 auto; }

    .message {
      margin: 0 20px 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fff4f4;
      color: #a23d50;
      font-size: 13px;
    }

    .list { padding: 0 20px 12px; }

    .transaction {
      gap: 13px;
      padding: 14px 0;
      border-top: 1px solid #efedf5;
    }

    .transaction-icon {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border-radius: 13px;
      background: #f0ebff;
      font-size: 19px;
    }

    .transaction-info { min-width: 0; flex: 1; }
    .transaction-info h3 { margin: 0 0 4px; color: #302d48; font-size: 14px; overflow-wrap: anywhere; }
    .transaction-info p { margin: 0; color: #77788e; font-size: 12px; line-height: 1.5; }

    .transaction-right { display: flex; align-items: center; gap: 14px; }
    .amount { color: #b43d55; font-size: 14px; white-space: nowrap; }
    .amount.income { color: #21804f; }

    .transaction-actions { gap: 6px; }

    .icon-button {
      width: 34px;
      height: 34px;
      border: 1px solid #e5e3ef;
      border-radius: 9px;
      background: white;
      color: #51427d;
      cursor: pointer;
    }

    .empty {
      padding: 38px 20px;
      color: #77788e;
      text-align: center;
    }

    .empty h3 { margin: 0 0 7px; color: #302d48; }
    .empty p { margin: 0; font-size: 13px; }

    @media (max-width: 760px) {
      .page { padding: 22px 14px 32px; }
      .summary { grid-template-columns: 1fr; gap: 10px; }
      .stat { padding: 15px; }
      .stat-value { font-size: 22px; }
      .filters { padding: 0 14px 15px; }
      .section-heading { padding: 17px 14px 13px; }
      .list { padding: 0 14px 10px; }
      .message { margin: 0 14px 14px; }
      .transaction { flex-wrap: wrap; }
      .transaction-right { width: 100%; justify-content: space-between; padding-left: 55px; }
    }

    @media (max-width: 420px) {
      .page-header { align-items: flex-start; flex-direction: column; }
      .filters .control { flex-basis: 100%; }
      .clear-button { width: 100%; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="page-header">
      <div>
        <p class="eyebrow">Your activity</p>
        <h1>Transactions</h1>
        <p class="subtitle">Search and manage your income and expenses.</p>
      </div>
      <a class="button button-primary" href="add-transaction.html">＋ Add Transaction</a>
    </header>

    <section class="summary" aria-label="Transaction summary">
      <article class="stat">
        <div class="stat-label">Expenses in results</div>
        <div class="stat-value" id="totalSpent">₹0.00</div>
      </article>
      <article class="stat">
        <div class="stat-label">Income in results</div>
        <div class="stat-value" id="totalIncome">₹0.00</div>
      </article>
      <article class="stat">
        <div class="stat-label">Transactions in results</div>
        <div class="stat-value" id="totalCount">0</div>
      </article>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>All Transactions</h2>
        <span class="result-count" id="resultCount">Loading…</span>
      </div>

      <div class="filters">
        <input class="control search-control" id="searchInput" type="search"
          placeholder="Search merchant or category…" aria-label="Search transactions">

        <select class="control" id="typeFilter" aria-label="Filter by type">
          <option value="">All types</option>
          <option value="expense">Expenses</option>
          <option value="income">Income</option>
        </select>

        <select class="control" id="categoryFilter" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>

        <select class="control" id="cardFilter" aria-label="Filter by card">
          <option value="">All cards</option>
        </select>

        <input class="control" id="fromDate" type="date" aria-label="From date">
        <input class="control" id="toDate" type="date" aria-label="To date">

        <button class="button clear-button" id="clearFilters" type="button">Clear filters</button>
        <button class="button" id="refreshButton" type="button">Refresh</button>
      </div>

      <div id="pageMessage" hidden></div>
      <div class="list" id="transactionList" aria-live="polite">
        <div class="empty">Loading transactions…</div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://wrsqhsuktqldnyjrbuma.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const byId = id => document.getElementById(id);
    let transactions = [];
    let cardNames = {};

    function money(value) {
      const amount = Number(value) || 0;
      return "₹" + amount.toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function getType(transaction) {
      return String(transaction.type || "expense").toLowerCase() === "income"
        ? "income"
        : "expense";
    }

    function getDate(transaction) {
      return transaction.transaction_date || "";
    }

    function addText(parent, tag, text, className) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = String(text ?? "");
      parent.appendChild(element);
      return element;
    }

    function showMessage(text) {
      const message = byId("pageMessage");
      message.textContent = text;
      message.className = "message";
      message.hidden = false;
    }

    function clearMessage() {
      byId("pageMessage").hidden = true;
      byId("pageMessage").textContent = "";
    }

    function formatDate(value) {
      if (!value) return "Date not set";
      const date = new Date(value + "T00:00:00");
      return Number.isNaN(date.getTime())
        ? value
        : date.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
    }

    function fillFilters() {
      const categories = [...new Set(
        transactions.map(item => item.category).filter(Boolean)
      )].sort();

      const categorySelect = byId("categoryFilter");
      const oldCategory = categorySelect.value;
      categorySelect.replaceChildren(new Option("All categories", ""));

      categories.forEach(category => {
        categorySelect.add(new Option(category, category));
      });

      if (categories.includes(oldCategory)) categorySelect.value = oldCategory;

      const cardSelect = byId("cardFilter");
      const oldCard = cardSelect.value;
      cardSelect.replaceChildren(new Option("All cards", ""));

      const ids = [...new Set(
        transactions.map(item => String(item.card_id || "")).filter(Boolean)
      )];

      ids.forEach(id => {
        cardSelect.add(new Option(cardNames[id] || "Card", id));
      });

      if (ids.includes(oldCard)) cardSelect.value = oldCard;

      const queryCardId = new URLSearchParams(location.search).get("card_id");
      if (queryCardId && ids.includes(queryCardId)) cardSelect.value = queryCardId;
    }

    function renderTransactions() {
      const search = byId("searchInput").value.trim().toLowerCase();
      const type = byId("typeFilter").value;
      const category = byId("categoryFilter").value;
      const cardId = byId("cardFilter").value;
      const from = byId("fromDate").value;
      const to = byId("toDate").value;

      const filtered = transactions.filter(item => {
        const cardName = cardNames[String(item.card_id)] || "";
        const searchText = `${item.merchant || ""} ${item.category || ""} ${cardName}`.toLowerCase();
        const date = getDate(item);

        return (!search || searchText.includes(search)) &&
          (!type || getType(item) === type) &&
          (!category || item.category === category) &&
          (!cardId || String(item.card_id || "") === cardId) &&
          (!from || !date || date >= from) &&
          (!to || !date || date <= to);
      });

      const expenses = filtered
        .filter(item => getType(item) === "expense")
        .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

      const income = filtered
        .filter(item => getType(item) === "income")
        .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

      byId("totalSpent").textContent = money(expenses);
      byId("totalIncome").textContent = money(income);
      byId("totalCount").textContent = String(filtered.length);
      byId("resultCount").textContent =
        `${filtered.length} ${filtered.length === 1 ? "result" : "results"}`;

      const list = byId("transactionList");

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        addText(empty, "h3", transactions.length ? "No matching transactions" : "No transactions yet");
        addText(empty, "p", transactions.length
          ? "Try changing your search or filters."
          : "Add a transaction to see it here.");
        list.replaceChildren(empty);
        return;
      }

      const fragment = document.createDocumentFragment();

      filtered.sort((a, b) => String(getDate(b)).localeCompare(String(getDate(a))));

      filtered.forEach(item => {
        const row = document.createElement("article");
        row.className = "transaction";

        const icon = addText(row, "span", getType(item) === "income" ? "↗" : "↘", "transaction-icon");
        icon.setAttribute("aria-hidden", "true");

        const info = document.createElement("div");
        info.className = "transaction-info";
        addText(info, "h3", item.merchant || "Transaction");
        addText(
          info,
          "p",
          `${formatDate(getDate(item))} · ${item.category || "Other"} · ${cardNames[String(item.card_id)] || "Card"}`
        );

        const right = document.createElement("div");
        right.className = "transaction-right";

        const amount = addText(
          right,
          "strong",
          `${getType(item) === "income" ? "+" : "−"}${money(item.amount)}`,
          `amount ${getType(item)}`
        );

        const actions = document.createElement("div");
        actions.className = "transaction-actions";

        const edit = addText(actions, "button", "Edit", "icon-button");
        edit.type = "button";
        edit.addEventListener("click", () => {
          location.href = "edit-transaction.html?id=" + encodeURIComponent(item.id);
        });

        const remove = addText(actions, "button", "Delete", "icon-button");
        remove.type = "button";
        remove.addEventListener("click", () => deleteTransaction(item));

        right.appendChild(actions);
        row.append(icon, info, right);
        fragment.appendChild(row);
      });

      list.replaceChildren(fragment);
    }

    async function loadTransactions() {
      clearMessage();
      byId("refreshButton").disabled = true;
      byId("transactionList").replaceChildren(
        Object.assign(document.createElement("div"), {
          className: "empty",
          textContent: "Loading transactions…"
        })
      );

      try {
        const { data: authData, error: authError } =
          await supabaseClient.auth.getUser();

        if (authError || !authData.user) {
          location.href = "index.html";
          return;
        }

        const user = authData.user;

        const { data: cards, error: cardError } = await supabaseClient
          .from("cards")
          .select("id, name")
          .eq("user_id", user.id);

        if (cardError) console.warn("Card names could not be loaded:", cardError.message);

        cardNames = {};
        (cards || []).forEach(card => {
          cardNames[String(card.id)] = card.name || "Card";
        });

        const { data, error } = await supabaseClient
          .from("transactions")
          .select("id, card_id, merchant, amount, type, category, transaction_date")
          .order("transaction_date", { ascending: false });

        if (error) throw error;

        transactions = data || [];
        fillFilters();
        renderTransactions();
      } catch (error) {
        console.error("Transaction loading error:", error);
        showMessage("Could not load transactions: " + (error.message || "Please try again."));
        byId("resultCount").textContent = "Load failed";
        byId("transactionList").replaceChildren();
      } finally {
        byId("refreshButton").disabled = false;
      }
    }

    async function deleteTransaction(item) {
      if (!confirm("Delete this transaction? This cannot be undone.")) return;

      try {
        const { error } = await supabaseClient
          .from("transactions")
          .delete()
          .eq("id", item.id);

        if (error) throw error;

        transactions = transactions.filter(row => String(row.id) !== String(item.id));
        fillFilters();
        renderTransactions();
      } catch (error) {
        console.error("Delete error:", error);
        showMessage("Could not delete transaction: " + (error.message || "Check your Supabase permissions."));
      }
    }

    ["searchInput", "typeFilter", "categoryFilter", "cardFilter", "fromDate", "toDate"]
      .forEach(id => byId(id).addEventListener(
        id === "searchInput" ? "input" : "change",
        renderTransactions
      ));

    byId("clearFilters").addEventListener("click", () => {
      ["searchInput", "typeFilter", "categoryFilter", "cardFilter", "fromDate", "toDate"]
        .forEach(id => { byId(id).value = ""; });
      renderTransactions();
    });

    byId("refreshButton").addEventListener("click", loadTransactions);

    loadTransactions();
  </script>

  <script src="js/nav.js"></script>
</body>
</html>
