<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://wrsqhsuktqldnyjrbuma.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1-wC9ij9iOkR0txvg6j5bA_i1XLPSj7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



/* =========================================
   ELEMENTS
========================================= */

const transactionList =
    document.getElementById(
        "transactionList"
    );


const totalSpent =
    document.getElementById(
        "totalSpent"
    );


const transactionCount =
    document.getElementById(
        "transactionCount"
    );


const resultCount =
    document.getElementById(
        "resultCount"
    );


const searchInput =
    document.getElementById(
        "transactionSearch"
    );


const categoryFilter =
    document.getElementById(
        "categoryFilter"
    );


const cardFilter =
    document.getElementById(
        "cardFilter"
    );


const fromDate =
    document.getElementById(
        "fromDate"
    );


const toDate =
    document.getElementById(
        "toDate"
    );


const clearFilters =
    document.getElementById(
        "clearFilters"
    );



let transactions = [];

let cardsMap = {};



/* =========================================
   LOAD DATA
========================================= */

async function loadTransactions() {


    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();


    if (
        error ||
        !data ||
        !data.user
    ) {

        window.location.href =
            "index.html";

        return;

    }



    transactionList.innerHTML =
        "<p>Loading transactions...</p>";



    /* =========================
       LOAD CARDS
    ========================== */

    const {
        data: cards,
        error: cardsError
    } =
        await supabaseClient

            .from("cards")

            .select(
                "id, name, issuer"
            )

            .eq(
                "user_id",
                data.user.id
            );



    if (cardsError) {

        console.error(
            cardsError
        );

        cardsMap = {};

    }
    else {

        cardsMap = {};


        (cards || [])
            .forEach(
                function(card) {

                    cardsMap[
                        String(card.id)
                    ] = card;

                }
            );


        populateCardFilter(
            cards || []
        );

    }



    /* =========================
       LOAD TRANSACTIONS
    ========================== */

    const {
        data: transactionData,
        error: transactionError
    } =
        await supabaseClient

            .from("transactions")

            .select("*")

            .eq(
                "type",
                "expense"
            )

            .order(
                "transaction_date",
                {
                    ascending: false
                }
            );



    if (transactionError) {

        console.error(
            transactionError
        );


        transactionList.innerHTML = `

            <div class="empty-transactions">

                <h3>
                    Could not load transactions
                </h3>

                <p>
                    ${escapeHtml(
                        transactionError.message
                    )}
                </p>

            </div>

        `;

        return;

    }



    transactions =
        transactionData || [];


    applyFilters();

}



/* =========================================
   CARD FILTER
========================================= */

function populateCardFilter(
    cards
) {


    cardFilter.innerHTML = `

        <option value="">
            All Cards
        </option>

    `;


    cards.forEach(
        function(card) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                card.id;


            option.textContent =
                card.name;


            cardFilter.appendChild(
                option
            );

        }
    );



    /* SUPPORT card_id FROM URL */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const urlCardId =
        params.get(
            "card_id"
        );


    if (urlCardId) {

        cardFilter.value =
            urlCardId;

    }

}



/* =========================================
   APPLY FILTERS
========================================= */

function applyFilters() {


    const search =
        searchInput.value
            .toLowerCase()
            .trim();


    const category =
        categoryFilter.value
            .toLowerCase();


    const selectedCard =
        cardFilter.value;


    const start =
        fromDate.value;


    const end =
        toDate.value;



    const filtered =
        transactions.filter(
            function(transaction) {


                /* SEARCH */

                const merchant =
                    String(
                        transaction.merchant ||
                        ""
                    )
                    .toLowerCase();


                if (
                    search &&
                    !merchant.includes(
                        search
                    )
                ) {

                    return false;

                }



                /* CATEGORY */

                const transactionCategory =
                    String(
                        transaction.category ||
                        ""
                    )
                    .toLowerCase();


                if (
                    category &&
                    transactionCategory !==
                    category
                ) {

                    return false;

                }



                /* CARD */

                if (
                    selectedCard &&
                    String(
                        transaction.card_id
                    ) !==
                    String(
                        selectedCard
                    )
                ) {

                    return false;

                }



                /* FROM DATE */

                if (
                    start &&
                    transaction.transaction_date <
                    start
                ) {

                    return false;

                }



                /* TO DATE */

                if (
                    end &&
                    transaction.transaction_date >
                    end
                ) {

                    return false;

                }



                return true;

            }
        );



    displayTransactions(
        filtered
    );

}



/* =========================================
   DISPLAY TRANSACTIONS
========================================= */

function displayTransactions(
    list
) {


    transactionList.innerHTML =
        "";



    let spent = 0;



    list.forEach(
        function(transaction) {


            const amount =
                Number(
                    transaction.amount ||
                    0
                );


            spent += amount;



            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "transaction-item";



            const date =
                transaction.transaction_date

                    ? new Date(
                        transaction.transaction_date +
                        "T00:00:00"
                    ).toLocaleDateString(
                        "en-IN"
                    )

                    : "—";



            const card =
                cardsMap[
                    String(
                        transaction.card_id
                    )
                ];



            const cardName =
                card
                    ? card.name
                    : "Card not linked";



            const category =
                transaction.category ||
                "Other";



            item.innerHTML = `

                <div class="transaction-icon">
                    ↘
                </div>


                <div class="transaction-info">

                    <h3>
                        ${escapeHtml(
                            transaction.merchant ||
                            "Transaction"
                        )}
                    </h3>


                    <p>
                        ${date}
                    </p>


                    <p>
                        ${escapeHtml(
                            cardName
                        )}
                    </p>


                    <p>
                        ${escapeHtml(
                            category
                        )}
                    </p>

                </div>


                <div class="transaction-right">

                    <strong class="expense-amount">

                        -₹${amount.toLocaleString(
                            "en-IN",
                            {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2
                            }
                        )}

                    </strong>


                    <div class="transaction-actions">

                        <button
                            type="button"
                            onclick="editTransaction('${String(transaction.id)}')"
                            title="Edit transaction"
                        >
                            ✏️
                        </button>


                        <button
                            type="button"
                            onclick="deleteTransaction('${String(transaction.id)}')"
                            title="Delete transaction"
                        >
                            🗑️
                        </button>

                    </div>

                </div>

            `;



            transactionList.appendChild(
                item
            );

        }
    );



    /* SUMMARY */

    totalSpent.textContent =
        "₹" +
        spent.toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );


    transactionCount.textContent =
        transactions.length;


    resultCount.textContent =
        list.length +
        (
            list.length === 1
                ? " result"
                : " results"
        );



    /* EMPTY */

    if (
        list.length === 0
    ) {

        transactionList.innerHTML = `

            <div class="empty-transactions">

                <h3>
                    No transactions found
                </h3>

                <p>
                    Try changing your search or filters.
                </p>

            </div>

        `;

    }

}



/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
    "input",
    applyFilters
);



/* =========================================
   CATEGORY FILTER
========================================= */

categoryFilter.addEventListener(
    "change",
    applyFilters
);



/* =========================================
   CARD FILTER
========================================= */

cardFilter.addEventListener(
    "change",
    applyFilters
);



/* =========================================
   DATE FILTERS
========================================= */

fromDate.addEventListener(
    "change",
    applyFilters
);


toDate.addEventListener(
    "change",
    applyFilters
);



/* =========================================
   CLEAR FILTERS
========================================= */

clearFilters.addEventListener(
    "click",
    function() {


        searchInput.value =
            "";


        categoryFilter.value =
            "";


        cardFilter.value =
            "";


        fromDate.value =
            "";


        toDate.value =
            "";


        applyFilters();

    }
);



/* =========================================
   EDIT
========================================= */

function editTransaction(
    id
) {


    window.location.href =
        "edit-transaction.html?id=" +
        encodeURIComponent(
            id
        );

}



/* =========================================
   DELETE
========================================= */

async function deleteTransaction(
    id
) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this transaction?"
        );


    if (!confirmed) {

        return;

    }



    const {
        error
    } =
        await supabaseClient

            .from("transactions")

            .delete()

            .eq(
                "id",
                id
            );



    if (error) {

        console.error(
            error
        );


        alert(
            "Could not delete transaction.\n\n" +
            error.message
        );


        return;

    }



    alert(
        "Transaction deleted successfully!"
    );


    await loadTransactions();

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
    value
) {


    return String(
        value || ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
